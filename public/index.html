  }
  const b=onlineShopObj();
  if(!b||b.onlineStore===false||b.suspended){S.onlineBizId=null;S.pubShop=null;return viewOnline()}
  const cart=S.onlineCart||[];
  const cartMap={};cart.forEach(c=>cartMap[c.id]=c.qty);
  let total=0;cart.forEach(c=>total+=c.price*c.qty);total=money(total);
  const byCat={};
  (b.products||[]).filter(p=>p.active!==false&&(p.stock||0)>0).forEach(p=>{
    const k=p.sourceCat||'other';
    if(!byCat[k])byCat[k]=[];
    byCat[k].push(p);
  });
  const sections=Object.keys(byCat).map(k=>{
    const label=CATALOG[k]?CATALOG[k].label:(k==='other'||k==='custom'?'More items':k);
    const cards=byCat[k].map(p=>{
      const inC=cartMap[p.id];
      return `<button type="button" data-online-add="${p.id}" class="text-left bg-white border rounded-xl overflow-hidden hover:shadow-md transition ${inC?'card-sel':''}">
        ${productThumbWide(p)}
        <div class="p-3">
          <p class="font-medium text-sm leading-snug line-clamp-2">${esc(p.name)}</p>
          <p class="text-xs text-slate-400 mt-1">${esc(pricePerLabel(p.unit||'pc'))} · ${p.stock} ${esc(unitSuffix(p.unit||'pc'))} left</p>
          <div class="flex items-center justify-between mt-2 gap-2">
            <p class="font-bold" style="color:${b.color||'#0d9488'}">${kes(p.price)}</p>
            <span class="text-xs px-2 py-0.5 rounded-full ${inC?'text-white':'bg-slate-100 text-slate-600'}" style="${inC?'background:'+(b.color||'#0d9488'):''}">${inC?('×'+inC):'+ Add'}</span>
          </div>
        </div>
      </button>`;
    }).join('');
    return `<div class="mb-8"><h2 class="font-semibold text-lg mb-3 border-b pb-2" style="border-color:${b.color||'#0d9488'}40">${esc(label)}</h2><div class="grid grid-cols-2 md:grid-cols-3 gap-3">${cards}</div></div>`;
  }).join('')||'<p class="text-slate-400 text-center py-16">This shop has no products in stock yet</p>';
  return `<div class="min-h-screen bg-slate-50 pb-28">
  <header class="bg-white border-b px-4 h-14 flex items-center justify-between sticky top-0 z-20">
    <button type="button" id="onlineBack" class="text-sm text-slate-600">← All shops</button>
    <div class="flex items-center gap-2 font-semibold text-sm">${logoHtml(b.name,b.color,28)} <span class="truncate max-w-[140px]">${esc(b.name)}</span></div>
    <span class="text-sm font-medium">${cart.reduce((s,c)=>s+c.qty,0)} in cart</span>
  </header>
  <div class="max-w-4xl mx-auto p-4">
    <div class="bg-white rounded-2xl border p-4 mb-6 flex flex-wrap gap-3 items-center">
      ${logoHtml(b.name,b.color,56)}
      <div>
        <h1 class="text-xl font-bold">${esc(b.name)}</h1>
        <p class="text-sm text-slate-500">${esc(b.categoryLabel||'')}</p>
        <p class="text-xs text-slate-400">${esc(b.address||'')} ${b.phone?'· '+esc(b.phone):''}</p>
      </div>
    </div>
    ${sections}
  </div>
  ${cart.length?`<div class="fixed bottom-0 left-0 right-0 bg-white border-t p-4 shadow-lg z-30">
    <div class="max-w-4xl mx-auto space-y-2">
      <div class="flex justify-between text-sm"><span>Cart total</span><span class="font-bold text-lg">${kes(total)}</span></div>
      <div class="grid sm:grid-cols-2 md:grid-cols-4 gap-2 text-sm">
        <input id="olName" placeholder="Your name *" class="border rounded-xl px-3 py-2"/>
        <input id="olPhone" placeholder="M-Pesa / phone *" class="border rounded-xl px-3 py-2"/>
        <select id="olFulfill" class="border rounded-xl px-3 py-2"><option value="pickup">Pickup</option><option value="delivery">Delivery</option></select>
        <select id="olPay" class="border rounded-xl px-3 py-2">
          <option value="mpesa">M-Pesa</option>
          <option value="cod">Pay on delivery / pickup</option>
          <option value="card">Card (Pesapal / Flutterwave)</option>
        </select>
      </div>
      <input id="olAddr" class="w-full border rounded-xl px-3 py-2 text-sm hidden" placeholder="Delivery address"/>
      <button type="button" id="olPlace" class="w-full py-3 rounded-xl text-white font-semibold" style="background:${b.color||'#0d9488'}">Pay &amp; place order · ${kes(total)}</button>
      <p class="text-xs text-center text-slate-400">${esc((b.payments&&b.payments.till)?('Till/Paybill: '+b.payments.till):'Shop will confirm payment')}</p>
    </div>
  </div>`:''}
  </div>`;
}

function bind(){
  if(!window.bhNavClick){
    window.bhNavClick=true;
    document.addEventListener('click',function(ev){
      const nav=ev.target&&ev.target.closest&&ev.target.closest('[data-nav]');
      if(nav){
        ev.preventDefault();
        ev.stopPropagation();
        const key=nav.getAttribute('data-nav');
        if(key)goApp(key);
        return;
      }
      const tab=ev.target&&ev.target.closest&&ev.target.closest('[data-admin-tab]');
      if(tab){ev.preventDefault();S.adminTab=tab.getAttribute('data-admin-tab');render();return}
      const mt=ev.target&&ev.target.closest&&ev.target.closest('#menuToggle');
      if(mt){ev.preventDefault();const side=document.getElementById('appSidebar');if(side)side.classList.toggle('mobile-open');return}
    });
  }
  // Event delegation for Unlock PIN (works even if buttons re-render)
  if(!window.bhUnlockPinClick){
    window.bhUnlockPinClick=true;
    document.addEventListener('click', function(ev){
      const t=ev.target && ev.target.closest && ev.target.closest('[data-unlock-pin],[data-reset-pin]');
      if(!t)return;
      if(t.getAttribute('data-unlock-pin')){
        ev.preventDefault();
        const id=t.getAttribute('data-unlock-pin');
        const fn=window.__doUnlockPin||(typeof doUnlockPin==='function'?doUnlockPin:null);
        if(fn)fn(id,'');
        return;
      }
      if(t.getAttribute('data-reset-pin')){
        ev.preventDefault();
        const id=t.getAttribute('data-reset-pin');
        const np=prompt('Enter NEW sales PIN (4–6 digits):','1234');
        if(np===null)return;
        if(!/^\d{4,6}$/.test(String(np).trim())){alert('PIN must be 4–6 digits');return}
        const fn=window.__doUnlockPin||(typeof doUnlockPin==='function'?doUnlockPin:null);
        if(fn)fn(id, String(np).trim());
      }
    });
  }

  
  document.querySelectorAll('[data-login-mode]').forEach(b=>b.onclick=()=>{S.loginMode=b.getAttribute('data-login-mode');render()});
  const wlf=document.getElementById('workerLoginForm');
  if(wlf)wlf.onsubmit=e=>{
    e.preventDefault();
    const fd=new FormData(wlf);
    const err=document.getElementById('workerLoginErr');
    err.classList.add('hidden');
    const ownerEmail=String(fd.get('ownerEmail')).toLowerCase().trim();
    const username=String(fd.get('username')).toLowerCase().trim();
    const password=String(fd.get('password')||'');
    const d=db();
    let owner=d.users.find(u=>String(u.email||'').toLowerCase()===ownerEmail&&u.role!=='admin');
    // Offline: still allow worker login if businesses exist for this owner email
    let businesses=(d.businesses||[]).filter(b=>
      (owner&&b.ownerId===owner.id)||
      String(b.ownerEmail||'').toLowerCase()===ownerEmail
    );
    if(!owner&&businesses.length){
      owner={id:businesses[0].ownerId||('owner-'+ownerEmail),email:ownerEmail,role:'owner',name:ownerEmail};
    }
    if(!owner){err.textContent='Owner account not found on this device. Owner must open the app once online here first.';err.classList.remove('hidden');return}
    if(!businesses.length)businesses=(d.businesses||[]).filter(b=>b.ownerId===owner.id);
    let found=null,bizFound=null;
    for(const b of businesses){
      const w=(b.workers||[]).find(x=>String(x.username||'').toLowerCase()===username);
      if(w){found=w;bizFound=b;break}
    }
    if(!found||!bizFound){err.textContent='Worker username not found for this owner';err.classList.remove('hidden');return}
    if(String(found.password||'')!==password){err.textContent='Incorrect worker password';err.classList.remove('hidden');return}
    // Clear owner session if any
    d.session=null;d.currentBizId=bizFound.id;save(d);
    setWorkerSession({workerId:found.id,businessId:bizFound.id,ownerId:owner.id,name:found.name,username:found.username});
    S.view='worker';S.appView='dashboard';
    toast('Welcome, '+found.name);
    render();
  };
  const shopModeSelect=document.getElementById('shopModeSelect');
  if(shopModeSelect)shopModeSelect.onchange=()=>{
    const b=biz();if(!b)return;
    b.shopMode=shopModeSelect.value;
    if(b.shopMode==='team'&&b.requireWorkerSalePassword==null)b.requireWorkerSalePassword=true;
    saveBiz(b);toast(b.shopMode==='team'?'Team mode — add workers under Workers':'Solo mode — full owner menu');
  };
  const requireWorkerSalePw=document.getElementById('requireWorkerSalePw');
  if(requireWorkerSalePw)requireWorkerSalePw.onchange=()=>{
    const b=biz();if(!b)return;
    b.requireWorkerSalePassword=!!requireWorkerSalePw.checked;
    saveBiz(b);toast(b.requireWorkerSalePassword?'Worker password required on sales':'Worker password optional');
  };
  // Override add worker form to include username/password
  const addWorkerForm2=document.getElementById('addWorkerForm2');
  if(addWorkerForm2){
    addWorkerForm2.onsubmit=e=>{
      e.preventDefault();
      const fd=new FormData(addWorkerForm2);
      const b=biz();if(!b)return;
      if(!b.workers)b.workers=[];
      if(!canAddWorker(b))return;
      const username=String(fd.get('username')||'').toLowerCase().trim();
      if(b.workers.some(w=>String(w.username||'').toLowerCase()===username)){alert('Username already used');return}
      const firstName=String(fd.get('firstName')||fd.get('name')||'').trim();
      const lastName=String(fd.get('lastName')||'').trim();
      b.workers.push({
        id:uid(),
        firstName,lastName,
        name:(firstName+' '+lastName).trim(),
        username:username,
        password:String(fd.get('password')||''),
        phone:fd.get('phone')||'',
        role:fd.get('role')||'cashier',
        branchId:fd.get('branchId')||'main',
        commissionPct:Number(fd.get('commissionPct'))||0,
        createdAt:today(),
        permissions:{
          dashboard:!!fd.get('perm_dashboard'),
          shop:!!fd.get('perm_shop'),
          invoices:!!fd.get('perm_invoices'),
          onlineorders:!!fd.get('perm_onlineorders'),
          delivery:!!fd.get('perm_delivery'),
          stock:!!fd.get('perm_stock'),
          products:!!fd.get('perm_products'),
          customers:!!fd.get('perm_customers'),
          purchases:!!fd.get('perm_purchases'),
          expenses:!!fd.get('perm_expenses'),
          shifts:!!fd.get('perm_shifts'),
          reports:!!fd.get('perm_reports')
        }
      });
      saveBiz(b);pushAudit('worker_added',username);toast('Worker added with separate login');render();
    };
  }

  const cartDiscount=document.getElementById('cartDiscount');
  if(cartDiscount)cartDiscount.onchange=cartDiscount.oninput=()=>{S.cartDiscount=Number(cartDiscount.value)||0;render()};
  const receiptWidth=document.getElementById('receiptWidth');
  if(receiptWidth)receiptWidth.onchange=()=>{S.receiptWidth=receiptWidth.value;render()};
  const barcodeScan=document.getElementById('barcodeScan');
  function handlePosBarcode(code){
    code=String(code||'').trim();if(!code)return;
    const p=addProductToCartByBarcode(code);
    if(barcodeScan){barcodeScan.value='';barcodeScan.focus()}
    if(p){
      if(S.scanContinuous){/* stay on shop, soft refresh cart only */}
      render();
      setTimeout(()=>{const el=document.getElementById('barcodeScan');if(el)el.focus()},100);
    }
  }
  if(barcodeScan){
    barcodeScan.focus();
    barcodeScan.onkeydown=e=>{
      if(e.key!=='Enter')return;
      e.preventDefault();
      handlePosBarcode(barcodeScan.value);
    };
  }
  const scanContinuous=document.getElementById('scanContinuous');
  if(scanContinuous)scanContinuous.onchange=()=>{S.scanContinuous=!!scanContinuous.checked};
  const cameraScanBtn=document.getElementById('cameraScanBtn');
  if(cameraScanBtn)cameraScanBtn.onclick=()=>startCameraBarcodeScan(code=>handlePosBarcode(code));
  const stockBarcodeScan=document.getElementById('stockBarcodeScan');
  if(stockBarcodeScan)stockBarcodeScan.onkeydown=e=>{
    if(e.key!=='Enter')return;
    e.preventDefault();
    const code=stockBarcodeScan.value.trim();
    const p=findProductByBarcode(biz(),code);
    if(!p){toast('Not found: '+code);return}
    S.stockSearch=p.name;S.invTab='overview';
    stockBarcodeScan.value='';
    toast(p.name+' · stock '+(p.stock||0));render();
  };
  const stockCameraScan=document.getElementById('stockCameraScan');
  if(stockCameraScan)stockCameraScan.onclick=()=>startCameraBarcodeScan(code=>{
    const p=findProductByBarcode(biz(),code);
    if(!p){toast('Not found: '+code);return}
    S.stockSearch=p.name;S.invTab='overview';toast(p.name+' · stock '+(p.stock||0));render();
  });

  const requireShiftForSale=document.getElementById('requireShiftForSale');
  if(requireShiftForSale)requireShiftForSale.onchange=()=>{
    const b=biz();if(!b)return;b.requireShiftForSale=!!requireShiftForSale.checked;saveBiz(b);
    toast(b.requireShiftForSale?'Shift required before sales':'Shift optional');
  };

  document.getElementById('workerSignOut')&&(document.getElementById('workerSignOut').onclick=()=>{clearWorkerSession();S.view='workerLogin';render();toast('Worker logged out')});
  document.getElementById('workerSignOut2')&&(document.getElementById('workerSignOut2').onclick=()=>{clearWorkerSession();S.view='workerLogin';render();toast('Worker logged out')});
  const workerBackBtn=document.getElementById('workerBackBtn');
  if(workerBackBtn)workerBackBtn.onclick=()=>{
    if(S.appView&&S.appView!=='dashboard'){S.appView='dashboard';S.viewInvoiceId=null;render();return}
    if(confirm('Leave worker portal and open worker login?')){clearWorkerSession();S.view='workerLogin';render()}
  };
  document.getElementById('workerSignOut2')&&(document.getElementById('workerSignOut2').onclick=()=>{clearWorkerSession();S.view='login';S.loginMode='worker';render();toast('Worker logged out')});

document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.getAttribute('data-go')));
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>goApp(b.getAttribute('data-nav')));
  document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{S.color=b.getAttribute('data-color');render()});
  document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{S.filter=b.getAttribute('data-filter');render()});
  document.querySelectorAll('[data-chart]').forEach(b=>b.onclick=()=>{S.chartMode=b.getAttribute('data-chart');render()});
  document.querySelectorAll('[data-biz-cat-tab]').forEach(b=>b.onclick=()=>{S.bizCatTab=b.getAttribute('data-biz-cat-tab');S.filter='All';render()});
  document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{S.payMethod=b.getAttribute('data-pay');render()});
  document.querySelectorAll('[data-open-inv]').forEach(b=>b.onclick=()=>{S.viewInvoiceId=b.getAttribute('data-open-inv');S.appView='invoices';render()});
  document.querySelectorAll('[data-toggle-pw]').forEach(btn=>{
    btn.onclick=()=>{const i=btn.parentElement.querySelector('input');if(!i)return;if(i.type==='password'){i.type='text';btn.textContent='Hide'}else{i.type='password';btn.textContent='Show'}}});
  document.querySelectorAll('[data-toggle-cat]').forEach(b=>{
    b.onclick=()=>{const k=b.getAttribute('data-toggle-cat');let sel=S.selectedCats.slice();
      if(sel.includes(k))sel=sel.filter(x=>x!==k);else sel.push(k);
      if(!sel.length)sel=['electrical'];S.selectedCats=sel;
      if(CATALOG[sel[0]])S.color=CATALOG[sel[0]].color;render()}});
  document.querySelectorAll('[data-online-biz]').forEach(b=>b.onclick=()=>{S.onlineBizId=b.getAttribute('data-online-biz');S.onlineCart=[];S.view='online';if(usePub())loadPubShop(S.onlineBizId);render()});

  const bizNameInput=document.getElementById('bizNameInput');
  if(bizNameInput){
    bizNameInput.oninput=()=>{
      const el=document.getElementById('logoPreview');
      if(el)el.innerHTML=logoHtml(bizNameInput.value||'BH',S.color,56);
    };
  }

  const printInv=document.getElementById('printInv');
  if(printInv)printInv.onclick=()=>window.print();
  const printReceiptOnly=document.getElementById('printReceiptOnly');
  if(printReceiptOnly)printReceiptOnly.onclick=()=>{
    const inv=document.querySelector('.invoice-print');
    const rec=document.querySelector('.receipt-print');
    if(inv)inv.classList.add('no-print');
    window.print();
    setTimeout(()=>{if(inv)inv.classList.remove('no-print')},500);
  };
  const refundInv=document.getElementById('refundInv');
  if(refundInv)refundInv.onclick=()=>{
    if(!confirm('Mark this sale as REFUNDED and restore stock?'))return;
    const b=biz();const o=(b.orders||[]).find(x=>x.id===S.viewInvoiceId);if(!o||o.status==='REFUNDED')return;
    (o.items||[]).forEach(it=>{
      const p=(b.products||[]).find(x=>x.id===it.product_id||x.name===it.name);
      if(p)p.stock=Math.round(((Number(p.stock)||0)+stockNeeded(p,it.unit||productPriceUnit(p),Number(it.qty)||0))*10000)/10000;
    });
    o.status='REFUNDED';o.refundedAt=today();
    saveBiz(b);pushAudit('refund',o.number);toast('Refunded · stock restored');render();
  };
  document.querySelectorAll('[data-rep-period]').forEach(el=>el.onclick=()=>{S.repPeriod=el.dataset.repPeriod;render()});
  document.querySelectorAll('[data-rep-shift]').forEach(el=>el.onclick=()=>{S.repDate=rpShift(S.repPeriod||'daily',S.repDate||today(),+el.dataset.repShift);render()});
  const repDate=document.getElementById('repDate');if(repDate)repDate.onchange=()=>{if(repDate.value){S.repDate=repDate.value;render()}};
  const repPrint=document.getElementById('repPrint');if(repPrint)repPrint.onclick=()=>window.print();
  document.querySelectorAll('[data-lptheme]').forEach(el=>el.onclick=()=>{const t=el.dataset.lptheme.split(',');const root=document.getElementById('lpRoot');if(root){root.style.setProperty('--brand',t[0]);root.style.setProperty('--brand2',t[1])}document.querySelectorAll('[data-lptheme]').forEach(x=>x.classList.toggle('on',x===el))});

  const lf=document.getElementById('loginForm');
  if(lf)lf.onsubmit=e=>{e.preventDefault();const fd=new FormData(lf);const d=db();
    const email=String(fd.get('email')).toLowerCase().trim();
    const password=fd.get('password');

    // Prefer offline unlock when no network (passwords are not stored after server login)
    if(navigator.onLine===false){
      tryOfflineOwnerLogin(email,password,null);
      return;
    }

    if(SERVER_MODE){
      api('/api/login',{method:'POST',body:{email:email,password:fd.get('password'),clientOnly:true}}).then(function(data){
        API_TOKEN=data.token; localStorage.setItem('bh_api_token',API_TOKEN);
        rememberOfflineLogin(email,fd.get('password'));
        const d=db();
        let u=d.users.find(x=>x.id===data.user.id);
        if(!u){u={id:data.user.id,email:data.user.email,password:'',name:data.user.name,role:data.user.role};d.users.push(u)}
        else {u.password='';u.name=data.user.name}
        d.session=u.id;save(d);
        try{if(document.getElementById('rememberMe')&&document.getElementById('rememberMe').checked)localStorage.setItem('bh_remember',JSON.stringify({email:email}))}catch(e){}
        syncPull().then(function(){
          const mine=db().businesses.filter(b=>b.ownerId===u.id);
          if(!mine.length){S.view='onboard';render()}
          else{db().currentBizId=mine[0].id;save(db());S.appView='dashboard';S.view='app';render()}
          clearWorkerSession();toast('Logged in (server)');
        });
      }).catch(function(err){
        tryOfflineOwnerLogin(email,fd.get('password'),err);
      });
      return;
    }

    if(!navigator.onLine){
      tryOfflineOwnerLogin(email,fd.get('password'),null);
      return;
    }

    const u=d.users.find(x=>x.email===email&&x.password&&x.password===fd.get('password'));
    if(!u){tryOfflineOwnerLogin(email,fd.get('password'),null);return}
    if(u.role==='admin'||u.email===(d.adminEmail||'admin@businesshub.ke')){
      document.getElementById('loginErr').textContent='This is a platform admin account. Use Admin login.';
      document.getElementById('loginErr').classList.remove('hidden');
      return;
    }
    rememberOfflineLogin(email,fd.get('password'));
    d.session=u.id;save(d);
    const mine=d.businesses.filter(b=>b.ownerId===u.id);
    if(!mine.length){S.view='onboard';render()}
    else{d.currentBizId=mine[0].id;save(d);S.appView='dashboard';S.view='app';render()}
    clearWorkerSession();toast('Logged in')};

  const alf=document.getElementById('adminLoginForm');
  if(alf)alf.onsubmit=e=>{e.preventDefault();const fd=new FormData(alf);const d=db();
    const email=String(fd.get('email')).toLowerCase().trim();
    const err=document.getElementById('adminLoginErr');err.classList.add('hidden');

    if(SERVER_MODE){
      api('/api/login',{method:'POST',body:{email:email,password:fd.get('password'),adminOnly:true}}).then(function(data){

    S.workerMenuOpen=!S.workerMenuOpen;
    const side=document.getElementById('workerSidebar');
    if(side){side.classList.toggle('open',!!S.workerMenuOpen)}
    else render();
  };
  document.querySelectorAll('[data-oo-filter]').forEach(btn=>btn.onclick=()=>{S.onlineOrderFilter=btn.getAttribute('data-oo-filter');render()});
  document.querySelectorAll('[data-set-order-status]').forEach(sel=>{
    sel.onchange=()=>{
      const b=biz();const id=sel.getAttribute('data-set-order-status');
      const o=(b.orders||[]).find(x=>x.id===id);if(!o)return;
      o.orderStatus=sel.value;

      if(sel.value==='CANCELLED'&&o.status!=='CANCELLED'){
        (o.items||[]).forEach(it=>{const p=(b.products||[]).find(x=>x.id===it.product_id);if(p)p.stock=Math.round(((Number(p.stock)||0)+stockNeeded(p,it.unit||productPriceUnit(p),Number(it.qty)||0))*10000)/10000});
        o.status='CANCELLED';
      }
      saveBiz(b);toast('Order '+o.number+' → '+sel.value);render();

  const onlineStoreToggle=document.getElementById('onlineStoreToggle');

  document.querySelectorAll('[data-inv-tab]').forEach(btn=>btn.onclick=()=>{S.invTab=btn.getAttribute('data-inv-tab');render()});
  const stockSearch=document.getElementById('stockSearch');
  if(stockSearch)stockSearch.oninput=()=>{S.stockSearch=stockSearch.value;/* debounce free */};
  if(stockSearch)stockSearch.onchange=()=>{S.stockSearch=stockSearch.value;render()};
  const stockMoveForm=document.getElementById('stockMoveForm');
  if(stockMoveForm)stockMoveForm.onsubmit=e=>{
    e.preventDefault();
    const fd=new FormData(stockMoveForm);
    const type=stockMoveForm.getAttribute('data-move');
    const b=biz();const p=(b.products||[]).find(x=>x.id===fd.get('productId'));
    if(!p){alert('Product not found');return}
    const unit=String(fd.get('unit')||p.unit||'pc');
    let qty=normalizeQty(unit,fd.get('qty'));
    if(type==='receive'){
      if(qty<=0){alert('Qty must be positive');return}
      p.stock=normalizeQty(unit,(Number(p.stock)||0)+qty);
      if(fd.get('batch'))p.batch=fd.get('batch');
      if(!p.unit)p.unit=unit;
      recordMovement(b,{type:'RECEIVE',productId:p.id,productName:p.name,qty,batch:fd.get('batch'),note:(fd.get('note')||'')+' ['+unitSuffix(unit)+']'});
    }else if(type==='issue'){
      if(qty<=0){alert('Qty must be positive');return}
      if((p.stock||0)<qty){alert('Insufficient stock');return}
      p.stock=normalizeQty(unit,(Number(p.stock)||0)-qty);
      recordMovement(b,{type:'ISSUE',productId:p.id,productName:p.name,qty:-qty,batch:fd.get('batch'),note:(fd.get('note')||'')+' ['+unitSuffix(unit)+']'});
    }else if(type==='adjust'){
      if(fd.get('absolute')){
        const prev=Number(p.stock)||0;
        p.stock=normalizeQty(unit,qty);
        recordMovement(b,{type:'ADJUST',productId:p.id,productName:p.name,qty:normalizeQty(unit,qty-prev),batch:fd.get('batch'),note:(fd.get('note')||'absolute set')+' ['+unitSuffix(unit)+']'});
      }else{
        p.stock=normalizeQty(unit,(Number(p.stock)||0)+qty);
        recordMovement(b,{type:'ADJUST',productId:p.id,productName:p.name,qty,batch:fd.get('batch'),note:(fd.get('note')||'')+' ['+unitSuffix(unit)+']'});
      }
    }
    saveBiz(b);toast('Stock '+type+' recorded');render();
  };
  const stockTransferForm=document.getElementById('stockTransferForm');
  if(stockTransferForm)stockTransferForm.onsubmit=e=>{
    e.preventDefault();
    const fd=new FormData(stockTransferForm);
    const b=biz();const p=(b.products||[]).find(x=>x.id===fd.get('productId'));
    if(!p)return;
    const qty=Number(fd.get('qty'))||0;
    if(qty<=0){alert('Qty must be positive');return}
    if((p.stock||0)<qty){alert('Insufficient stock');return}
    if(fd.get('fromBranch')===fd.get('toBranch')){alert('Choose different branches');return}
    p.stock=(Number(p.stock)||0)-qty;
    // same catalog; transfer is logged (per-branch stock can expand later)
    recordMovement(b,{type:'TRANSFER',productId:p.id,productName:p.name,qty:-qty,fromBranch:fd.get('fromBranch'),toBranch:fd.get('toBranch'),note:fd.get('note')});
    // credit destination conceptually
    recordMovement(b,{type:'TRANSFER_IN',productId:p.id,productName:p.name,qty:qty,fromBranch:fd.get('fromBranch'),toBranch:fd.get('toBranch'),note:fd.get('note')});
    p.stock=(Number(p.stock)||0)+qty; // keep global stock same for single-catalog; history shows transfer
    // Actually net zero for global - undo the -qty
    // wait: if we - then + net zero - good for global stock with history only
    saveBiz(b);toast('Transfer logged');render();
  };
  const regProductForm=document.getElementById('regProductForm');
  if(regProductForm)regProductForm.onsubmit=e=>{
    e.preventDefault();
    const fd=new FormData(regProductForm);
    const b=biz();if(!b.products)b.products=[];
    const name=String(fd.get('name')||'').trim();
    if(!name)return;
    const sku=String(fd.get('sku')||'').trim()||genSKU(b,name);
    const barcode=String(fd.get('barcode')||'').trim()||genBarcode();
    const stock=Number(fd.get('stock'))||0;
    const unit=String(fd.get('unit')||'pc').trim()||'pc';
    const packQty=Number(fd.get('packQty'))||1;
    const packUnit=String(fd.get('packUnit')||unit).trim()||unit;
    const p={
      id:uid(),name,sku,barcode,unit,packQty,packUnit,
      category:String(fd.get('category')||'').trim()||(b.categories&&b.categories[0])||'General',
      sub:String(fd.get('sub')||'').trim()||'Custom',
      price:Number(fd.get('price'))||0,
      cost:fd.get('cost')===''||fd.get('cost')==null?null:Number(fd.get('cost')),
      stock:normalizeQty(unit,stock),reorder:Number(fd.get('reorder'))||5,
      batch:String(fd.get('batch')||'').trim(),
      expiry:String(fd.get('expiry')||'').trim(),
      serial:String(fd.get('serial')||'').trim(),
      image:String(fd.get('image')||'').trim(),
      active:true
    };
    b.products.push(p);
    if(stock)recordMovement(b,{type:'RECEIVE',productId:p.id,productName:p.name,qty:stock,batch:p.batch,note:'Opening stock'});
    saveBiz(b);toast('Product registered');render();
  };
  const genMissingSku=document.getElementById('genMissingSku');
  if(genMissingSku)genMissingSku.onclick=()=>{

  };

    const b=biz();let n=0;
    (b.products||[]).forEach(p=>{if(!p.barcode){p.barcode=genBarcode();n++}});
    saveBiz(b);toast(n+' barcode(s) generated');render();
  };

  
  const prodBarcodeScan=document.getElementById('prodBarcodeScan');
  if(prodBarcodeScan)prodBarcodeScan.onkeydown=e=>{
    if(e.key!=='Enter')return;
    e.preventDefault();
    const code=prodBarcodeScan.value.trim();
    const p=findProductByBarcode(biz(),code);
    if(p){
      toast('Found: '+p.name+' · stock '+(p.stock||0));
      S.prodSearch=p.name;prodBarcodeScan.value='';render();
    }else{
      // prefill register form barcode
      const form=document.getElementById('regProductForm');
      if(form&&form.barcode){form.barcode.value=code;toast('New code ready — fill name and save')}

  const prodCameraScan=document.getElementById('prodCameraScan');
  if(prodCameraScan)prodCameraScan.onclick=()=>startCameraBarcodeScan(code=>{
    const p=findProductByBarcode(biz(),code);
    if(p){S.prodSearch=p.name;toast('Found: '+p.name);render();return}

    if(form&&form.barcode){form.barcode.value=code;toast('Scanned code set on new product form')}
  });

  
  const autoBackupToggle=document.getElementById('autoBackupToggle');

    const b=biz();if(!b)return;b.autoBackup=!!autoBackupToggle.checked;saveBiz(b);

  const forceAutoBackup=document.getElementById('forceAutoBackup');

    const b=biz();const u=currentUser();
    if(!b||!u)return;

      await api('/api/businesses/'+b.id+'/backup',{method:'POST',body:{email:u.email,sendEmail:false}});

      toast('Backup saved on server');render();
    }catch(e){alert(e.message||e)}
    finally{forceAutoBackup.disabled=false;forceAutoBackup.textContent='Run backup now (server)'}
  };

  
  document.querySelectorAll('[data-cunit]').forEach(sel=>{
    sel.onchange=()=>{
      const b=biz();const row=(b.cart||[]).find(c=>c.id===sel.getAttribute('data-cunit'));
      if(!row)return;
      const p=(b.products||[]).find(x=>x.id===row.id)||{};
      row.unit=sel.value||productPriceUnit(p);
      row.qty=normalizeQty(row.unit,row.qty);
      if(p.id&&stockNeeded(p,row.unit,row.qty)>(Number(p.stock)||0)+1e-9){row.qty=normalizeQty(row.unit,Math.floor((Number(p.stock)||0)/(sellFactor(p,row.unit).factor||1)*100)/100);toast('Qty reduced to available stock')}
      if(row.qty<=0)b.cart=b.cart.filter(c=>c.id!==row.id);else refreshCartLinePrice(row,p);
      saveBiz(b);toast('Unit '+unitLabel(row.unit)+' · '+kes(row.price)+' each');safeRender();
    };
  });
  document.querySelectorAll('[data-iunit]').forEach(sel=>{
    sel.onchange=()=>{
      const b=biz();const oid=sel.getAttribute('data-iunit');const idx=Number(sel.getAttribute('data-iidx'));
      const o=(b.orders||[]).find(x=>x.id===oid);if(!o||!o.items||!o.items[idx])return;
      o.items[idx].unit=sel.value||'pc';
      o.items[idx].qty=normalizeQty(o.items[idx].unit,o.items[idx].qty);
      const ip=(b.products||[]).find(x=>x.id===o.items[idx].product_id);
      if(ip){const pr=calcCartPricing(ip,o.items[idx].unit,o.items[idx].qty);if(pr.ok){o.items[idx].price=pr.unitPrice;o.items[idx].listPrice=pr.listPrice}else toast('No pack size for that unit — price not converted')}
      o.total=money((o.items||[]).reduce((s,it)=>s+Number(it.price||0)*Number(it.qty||0),0));
      saveBiz(b);safeRender();
    };
  });
  document.querySelectorAll('[data-iqty]').forEach(inp=>{
    const apply=()=>{
      const b=biz();const oid=inp.getAttribute('data-iqty');const idx=Number(inp.getAttribute('data-iidx'));
      const o=(b.orders||[]).find(x=>x.id===oid);if(!o||!o.items||!o.items[idx])return;
      const u=o.items[idx].unit||'pc';
      o.items[idx].qty=normalizeQty(u,inp.value);
      o.total=money((o.items||[]).reduce((s,it)=>s+Number(it.price||0)*Number(it.qty||0),0));
      saveBiz(b);safeRender();
    };
    inp.onchange=()=>apply();
    inp.onblur=()=>{setTimeout(apply,0)};
  });

  
  document.querySelectorAll('[data-punit]').forEach(sel=>{
    if(sel._boundUnit)return;sel._boundUnit=true;
    sel.onchange=()=>{
      const b=biz();const p=(b.products||[]).find(x=>x.id===sel.getAttribute('data-punit'));
      if(!p)return;const old=productPriceUnit(p);p.unit=sel.value||'pc';p.reviewed=true;
      if(!(Number(p.packQty)>1)||p.packUnit===old)p.packUnit=Number(p.packQty)>1?p.packUnit:p.unit;
      saveBiz(b);toast(p.name+': '+unitLabel(p.unit));render();
    };
  });
  // Stock form: when product chosen, set unit dropdown
  const stockProd=document.querySelector('#stockMoveForm select[name="productId"], #stockTransferForm select[name="productId"]');
  if(stockProd){
    const syncUnit=()=>{
      const b=biz();const p=(b.products||[]).find(x=>x.id===stockProd.value);
      const u=document.querySelector('#stockMoveForm select[name="unit"], #stockTransferForm select[name="unit"]');
      if(p&&u)u.value=unitMeta(p.unit||'pc').id;
    };
    stockProd.onchange=syncUnit;syncUnit();
  }

  const adminRefresh=document.getElementById('adminRefresh');
  if(adminRefresh)adminRefresh.onclick=()=>{
    if(!SERVER_MODE){toast('Local mode — no server');return}
    adminRefresh.disabled=true;adminRefresh.textContent='Refreshing…';
    syncPull().then(function(){adminRefresh.disabled=false;adminRefresh.textContent='Refresh from server';render();toast('Admin data refreshed')})
      .catch(function(e){adminRefresh.disabled=false;adminRefresh.textContent='Refresh from server';toast(e.message||'Refresh failed')});
  };
  document.querySelectorAll('[data-extend-trial]').forEach(btn=>btn.onclick=()=>{
    const id=btn.getAttribute('data-extend-trial');
    const d=db();const b=d.businesses.find(x=>x.id===id);
    if(!b)return;
    const ends=addDays(trialEndsOn(b),3);
    b.trialEndsAt=ends;b.trialExtended=true;save(d);
    if(SERVER_MODE){
      api('/api/businesses/'+id,{method:'PUT',body:{trialEndsAt:ends,trialExtended:true}}).then(function(){
        render();toast('Trial extended +3 days on server');
      }).catch(function(e){alert(e.message||e);});
      return;
    }
    render();toast('Trial extended +3 days')});
  document.querySelectorAll('[data-toggle-suspend]').forEach(btn=>btn.onclick=()=>{
    const id=btn.getAttribute('data-toggle-suspend');
    const d=db();const b=d.businesses.find(x=>x.id===id);
    if(!b)return;
    const next=!b.suspended;
    b.suspended=next;save(d);
    if(SERVER_MODE){
      api('/api/businesses/'+id,{method:'PUT',body:{suspended:next}}).then(function(){
        render();toast(next?'Business suspended on server':'Business activated on server');
      }).catch(function(e){b.suspended=!next;save(d);alert(e.message||e);render();});
      return;
    }
    render();toast(next?'Business suspended':'Business activated')});
  document.querySelectorAll('[data-reset-client]').forEach(btn=>btn.onclick=()=>{
    if(!confirm('Reset this client password? A temporary password will be shown once.'))return;
    const tmpPw='Bh'+Math.random().toString(36).slice(2,8)+'9x';
    const id=btn.getAttribute('data-reset-client');
    const d=db();const u=d.users.find(x=>x.id===id);
    if(!u)return;
    if(SERVER_MODE){
      api('/api/admin/users/reset-password',{method:'POST',body:{userId:id,password:tmpPw}}).then(function(){
        u.password='';save(d);alert('Temporary password (give it to the client, shown once):\n\n'+tmpPw);
      }).catch(function(err){alert(err.message||err);});
      return;
    }
    u.password=tmpPw;save(d);alert('Temporary password: '+tmpPw)});
  document.querySelectorAll('[data-delete-client]').forEach(btn=>btn.onclick=()=>{
    const id=btn.getAttribute('data-delete-client');
    const d=db();
    const u=d.users.find(x=>x.id===id);
    if(!u)return;
    const bizCount=(d.businesses||[]).filter(b=>b.ownerId===id).length;
    const msg='Delete client "'+(u.email||u.name)+'" and '+bizCount+' business(es)?\n\nThis permanently removes them from the server database.';
    if(!confirm(msg))return;
    const finishLocal=function(){
      const d2=db();
      d2.users=(d2.users||[]).filter(x=>x.id!==id);
      d2.businesses=(d2.businesses||[]).filter(b=>b.ownerId!==id);
      if(d2.currentBizId&&!(d2.businesses.find(b=>b.id===d2.currentBizId)))d2.currentBizId=null;
      save(d2);render();toast('Client permanently deleted');
    };
    if(SERVER_MODE){
      api('/api/admin/users',{method:'DELETE',body:{userId:id}}).then(function(){
        finishLocal();
        syncPull().then(function(){render();});
      }).catch(function(err){
        alert('Server delete failed: '+(err.message||err)+'\nClient was NOT removed from the database.');
      });
      return;
    }
    finishLocal();
  });
  document.querySelectorAll('[data-delete-biz]').forEach(btn=>btn.onclick=()=>{
    const id=btn.getAttribute('data-delete-biz');
    const d=db();
    const b=(d.businesses||[]).find(x=>x.id===id);
    if(!b)return;
    if(!confirm('Delete business "'+b.name+'" permanently from the server? Products and sales will be removed. The client account stays.'))return;
    const finish=function(){
      const d2=db();
      d2.businesses=(d2.businesses||[]).filter(x=>x.id!==id);
      if(d2.currentBizId===id)d2.currentBizId=null;
      save(d2);render();toast('Business permanently deleted');
    };
    if(SERVER_MODE){
      api('/api/businesses/'+id,{method:'DELETE'}).then(function(){finish();syncPull().then(function(){render();});})
        .catch(function(err){alert('Server delete failed: '+(err.message||err));});
      return;
    }
    finish();
  });
  document.querySelectorAll('[data-del-notice]').forEach(btn=>btn.onclick=()=>{
    const id=btn.getAttribute('data-del-notice');
    const d=db();d.notices=(d.notices||[]).filter(n=>n.id!==id);save(d);
    if(SERVER_MODE)api('/api/admin/notices',{method:'DELETE',body:{id:id}}).catch(function(){});
    render()});
  const platformForm=document.getElementById('platformForm');
  if(platformForm)platformForm.onsubmit=e=>{e.preventDefault();const fd=new FormData(platformForm);const d=db();
    if(!d.platform)d.platform={};
    ['company','ownerName','email','phone','address','city','country','mpesaTill','paybill','bankName','bankAccount','supportEmail','website','notes'].forEach(k=>d.platform[k]=fd.get(k)||'');
    if(d.platform.email)d.adminEmail=String(d.platform.email).toLowerCase().trim();
    save(d);
    if(SERVER_MODE){
      api('/api/admin/platform',{method:'PUT',body:d.platform}).then(function(){
        toast('Platform details saved on server');render();
      }).catch(function(err){toast('Saved locally — server: '+(err.message||err));render();});
      return;
    }
    toast('Platform details saved');render()};
  const noticeForm=document.getElementById('noticeForm');
  if(noticeForm)noticeForm.onsubmit=e=>{e.preventDefault();const fd=new FormData(noticeForm);const title=fd.get('title');const body=fd.get('body');
    const applyLocal=function(notice){
      const d=db();
      if(!d.notices)d.notices=[];
      d.notices.push(notice);
      d.platformUpdate={at:new Date().toISOString(),title:notice.title,body:notice.body};
      save(d);
    };
    if(SERVER_MODE){
      api('/api/admin/notices',{method:'POST',body:{title:title,body:body}}).then(function(data){
        applyLocal(data.notice||{id:uid(),title:title,body:body,date:today()});
        toast('Notice published to all clients');
        render();
      }).catch(function(err){
        applyLocal({id:uid(),title:title,body:body,date:today()});
        toast('Saved locally — server error: '+(err.message||err));
        render();
      });
      return;
    }
    applyLocal({id:uid(),title:title,body:body,date:today()});
    toast('Notice published');
    render()};

  /* install + admin extras */
  document.querySelectorAll('[data-install]').forEach(b=>b.onclick=()=>bhInstall());
  document.querySelectorAll('[data-inst-dismiss]').forEach(b=>b.onclick=()=>{try{localStorage.setItem('bh_inst_dismiss',String(Date.now()))}catch(e){}const w=b.closest('[data-install-wrap]');if(w)w.remove()});
  document.querySelectorAll('[data-ad-theme]').forEach(b=>b.onclick=()=>{try{localStorage.setItem('bh_admin_theme',b.dataset.adTheme)}catch(e){}render()});
  const adDarkBtn=document.getElementById('adDark');if(adDarkBtn)adDarkBtn.onclick=()=>{try{localStorage.setItem('bh_admin_dark',adDark()?'0':'1')}catch(e){}render()};
  document.querySelectorAll('[data-ad-goto]').forEach(b=>b.onclick=()=>{S.adminTab=b.dataset.adGoto;render()});
  const cSearch=document.getElementById('clientSearch');
  if(cSearch)cSearch.oninput=()=>{const q=cSearch.value.toLowerCase().trim();document.querySelectorAll('[data-q]').forEach(r=>{r.style.display=(!q||r.dataset.q.indexOf(q)>=0)?'':'none'})};
  const expBtn=document.getElementById('exportClients');
  if(expBtn)expBtn.onclick=()=>{const d=db();const rows=[['Name','Email','Phone','Businesses','Plans']];
    d.users.filter(u=>u.role!=='admin'&&u.email!==(d.adminEmail||'admin@businesshub.ke')).forEach(u=>{const ub=d.businesses.filter(b=>b.ownerId===u.id);
      rows.push([u.name||'',u.email||'',u.phone||'',ub.map(b=>b.name).join('; '),ub.map(b=>b.plan||'FREE').join('; ')])});
    const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='businesshub_clients_'+today()+'.csv';a.click();toast('Clients exported')};

}

setAccent('#0d9488');
const boot=db();
if(boot.session){
  const u=boot.users.find(x=>x.id===boot.session);
  if(u&&(u.role==='admin'||u.email===(boot.adminEmail||'admin@businesshub.ke'))){S.view='admin';S.adminTab='overview'}
  else if(myBusinesses().length){S.view='app';S.appView='dashboard'}
  else S.view='onboard';
}else S.view='landing';
try{const g=new URLSearchParams(location.search).get('go');if(g&&S.view==='app'&&['dashboard','shop','stock','invoices','reports','expenses','onlineorders'].includes(g))S.appView=g}catch(e){}
detectServer().then(function(on){
  if(on&&API_TOKEN) return syncPull().then(function(){toast('Synced from server')});
}).catch(function(){}).finally(function(){render();});
setInterval(function(){if(document.visibilityState==='visible')pullOnlineOrders()},20000);

</script>

<script>
(function(){
  var net=document.getElementById('netBar');
  function setNet(){if(net)net.classList.toggle('show',!navigator.onLine)}
  window.addEventListener('offline',function(){setNet();try{toast('Offline — data stays on this device')}catch(e){}});
  window.addEventListener('online',function(){
    setNet();
    try{
      (typeof detectServer==='function'?detectServer():Promise.resolve()).then(function(){
        try{if(typeof flushOfflineSales==='function')flushOfflineSales()}catch(e){}
        try{if(SERVER_MODE&&API_TOKEN&&!isAdmin()){myBusinesses().forEach(syncPushBiz);toast('Back online. Syncing…')}}catch(e){}
      });
    }catch(e){}
  });
  setNet();
  function showUpd(){var b=document.getElementById('updBar');if(b)b.classList.add('show')}
  var ub=document.getElementById('updBtn');if(ub)ub.onclick=function(){location.reload()};
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
    var had=!!navigator.serviceWorker.controller;
    window.addEventListener('load',function(){
      var heal=function(){try{navigator.serviceWorker.ready.then(function(r){if(navigator.onLine&&r.active)r.active.postMessage('ensure-cache')})}catch(e){}};
      window.addEventListener('online',heal);setTimeout(heal,4000);
      navigator.serviceWorker.register('/sw.js',{scope:'/'}).then(function(reg){
        reg.addEventListener('updatefound',function(){var nw=reg.installing;if(!nw)return;
          nw.addEventListener('statechange',function(){if(nw.state==='activated'&&had)showUpd()})});
        setInterval(function(){reg.update().catch(function(){})},3600000);
      }).catch(function(e){console.warn('SW register',e)});
    });
    navigator.serviceWorker.addEventListener('controllerchange',function(){/* new SW took control */});
  }
})();
</script>
</body>
</html>
