:root{--brand:#1d63d6;--brand2:#3aa51d}

.lp-blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.35;animation:lpFloat 14s ease-in-out infinite;pointer-events:none;transition:background .6s}
@keyframes lpFloat{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-40px) scale(1.15)}}
.lp-grad-text{background:linear-gradient(90deg,var(--brand),var(--brand2),var(--brand));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:lpShine 6s linear infinite}

.lp-btn{transition:transform .2s,box-shadow .2s,filter .2s,background .2s}

.lp-primary{background:linear-gradient(90deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 8px 20px -10px var(--brand)}

.lp-card{background:#fff;border:1px solid #e2e8f0;border-top:4px solid var(--c);border-radius:18px;padding:20px;transition:transform .25s,box-shadow .25s,border-color .25s;cursor:default}

.lp-ico{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;background:color-mix(in srgb,var(--c) 14%,white);transition:transform .25s}
.lp-card:hover .lp-ico{transform:rotate(-8deg) scale(1.12)}

.lp-logo-card:hover{transform:scale(1.02) rotate(-.6deg)}
.lp-sw{width:26px;height:26px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #cbd5e1;cursor:pointer;transition:transform .15s,box-shadow .15s;padding:0}
.lp-sw:hover{transform:scale(1.2)}.lp-sw.on{box-shadow:0 0 0 3px var(--brand)}

/* ========== SERVER MODE (shared database) ========== */
const API_BASE = (typeof location !== 'undefined' && location.protocol !== 'file:')
  ? (location.origin || '')
  : '';
let SERVER_MODE = false;
let API_TOKEN = localStorage.getItem('bh_api_token') || '';
try{localStorage.removeItem('bh_admin_remember');const _r=JSON.parse(localStorage.getItem('bh_remember')||'null');if(_r&&_r.password)localStorage.setItem('bh_remember',JSON.stringify({email:_r.email}))}catch(e){}

async function api(path, opts){
  opts = opts || {};
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if(API_TOKEN) headers.Authorization = 'Bearer '+API_TOKEN;
  const res = await fetch(API_BASE+path, {
    method: opts.method||'GET',
    headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error||('HTTP '+res.status));
  return data;
}

async function detectServer(){
  if(!API_BASE || location.protocol==='file:'){ SERVER_MODE=false; return false; }
  if(typeof navigator!=='undefined' && navigator.onLine===false){ SERVER_MODE=false; return false; }
  try{
    const ctrl=typeof AbortSignal!=='undefined'&&AbortSignal.timeout?AbortSignal.timeout(4000):undefined;
    const r = await fetch(API_BASE+'/api/health', {cache:'no-store', signal:ctrl});
    SERVER_MODE = r.ok;
    // Never wipe local passwords offline — only when server truly reachable
    if(SERVER_MODE){try{const d0=db();let ch=false;d0.users.forEach(u=>{if(u.password){u.password='';ch=true}});if(ch)save(d0)}catch(e){}}
  }catch(e){ SERVER_MODE=false; }
  return SERVER_MODE;
}

async function refreshNotices(){
  if(!SERVER_MODE || !API_TOKEN || isAdmin()) return;
  try{
    const n = await api('/api/notices');
    const d=db();
    d.notices = n.notices || [];
    d.platformUpdate = n.platformUpdate || null;
    save(d);
  }catch(e){}
}
async function syncPull(){
  if(!SERVER_MODE || !API_TOKEN) return;
  try{
    const me = await api('/api/me');
    const d = db();
    // mirror session user
    let u = d.users.find(x=>x.id===me.user.id);
    if(!u){
      u = {id:me.user.id,email:me.user.email,password:'',name:me.user.name,role:me.user.role};
      d.users.push(u);
    }else{
      u.name=me.user.name; u.role=me.user.role; u.email=me.user.email;
    }
    d.session = me.user.id;
    if(me.plans) d.plans = me.plans;
    if(me.isAdmin){
      const ov = await api('/api/admin/overview');
      // Replace non-admin users with server list (deleted clients disappear)
      const adminUsers = d.users.filter(u=>u.role==='admin'||u.email===(d.adminEmail||'admin@businesshub.ke')||u.id===me.user.id);
      const byId = {};
      adminUsers.forEach(u=>{ byId[u.id]=u; });
      (ov.clients||[]).forEach(c=>{
        byId[c.id] = {id:c.id,email:c.email,name:c.name||'',role:'owner',phone:c.phone||'',password:''};
      });
      // ensure current admin stays
      byId[me.user.id] = Object.assign(byId[me.user.id]||{},{id:me.user.id,email:me.user.email,name:me.user.name||'',role:'admin',password:(byId[me.user.id]&&byId[me.user.id].password)||''});
      d.users = Object.keys(byId).map(k=>byId[k]);
      d.adminEmail = me.user.email || d.adminEmail;
      // Businesses: full records preferred; fall back to overview summaries
      let fullBiz = [];
      try{
        const full = await api('/api/businesses');
        fullBiz = full.businesses || [];
      }catch(e){ console.warn('admin businesses fetch', e); }
      if(!fullBiz.length && ov.businesses && ov.businesses.length){
        fullBiz = ov.businesses.map(b=>({
          id:b.id, ownerId:b.ownerId, name:b.name||'Unnamed', plan:b.plan||'FREE',
          suspended:!!b.suspended, createdAt:b.createdAt, trialEndsAt:b.trialEndsAt,
          onlineStore:b.onlineStore!==false, products:[], orders:[], expenses:[]
        }));
      }
      d.businesses = fullBiz;
      d.platform = ov.platform || d.platform;
      d.notices = ov.notices || [];
      if(ov.plans) d.plans = ov.plans;
      d._adminTotals = ov.totals || null;
      try{
        const al=await api('/api/admin/alerts');
        d.adminAlerts=al.alerts||[];
      }catch(e){d.adminAlerts=d.adminAlerts||[]}
      try{
        const st=await api('/api/admin/platform-stats');
        d.platformStats=st;
        if(st.plans)d.plans=mergePlans(st.plans);
      }catch(e){}
      try{
        const tk=await api('/api/support/tickets');
        d.supportTickets=tk.tickets||[];
      }catch(e){d.supportTickets=d.supportTickets||[]}
    }else{
      const full = await api('/api/businesses');
      const remote = full.businesses || [];
      const other = d.businesses.filter(b=>b.ownerId!==me.user.id);
      const localMine = d.businesses.filter(b=>b.ownerId===me.user.id);
      const localMap = {};
      localMine.forEach(b=>{ localMap[b.id]=b; });
      const merged = remote.map(rb=>{
        const lb = localMap[rb.id];
        if(lb && lb.updatedAt && rb.updatedAt && lb.updatedAt > rb.updatedAt){
          // local newer — keep local and push
          syncPushBiz(lb);
          return lb;
        }
        if(lb && lb.updatedAt && !rb.updatedAt){
          syncPushBiz(lb);
          return lb;
        }
        return rb;
      });
      // local-only businesses not on server yet
      remote.forEach(rb=>{ delete localMap[rb.id]; });
      Object.keys(localMap).forEach(id=>{ merged.push(localMap[id]); syncPushBiz(localMap[id]); });
      d.businesses = other.concat(merged);
      const n = await api('/api/notices');
      d.notices = n.notices || [];
      d.platformUpdate = n.platformUpdate || null;
    }
    save(d);
  }catch(e){
    console.warn('syncPull', e);
    if(String(e.message||e).includes('Unauthorized')){
      API_TOKEN=''; localStorage.removeItem('bh_api_token');
    }
  }
}

let _pushQueue = Promise.resolve();
let _pushPending = {};
async function syncPushBiz(b){
  if(!SERVER_MODE || !API_TOKEN || !b || !b.id) return;
  b.updatedAt = new Date().toISOString();
  _pushPending[b.id] = b;
  _pushQueue = _pushQueue.then(async () => {
    const payload = _pushPending[b.id];
    if(!payload) return;
    delete _pushPending[b.id];
    try{
      await api('/api/businesses/'+payload.id, {method:'PUT', body:payload});
    }catch(e){
      console.warn('syncPushBiz', e);
      if(String(e.message||'').includes('Not found')){
        try{ await api('/api/businesses', {method:'POST', body:payload}); }catch(e2){ console.warn(e2); }
      } else {
        // re-queue once on failure
        _pushPending[payload.id] = payload;
      }
    }
  }).catch(function(e){ console.warn('push queue', e); });
  return _pushQueue;
}
async function flushPushes(){
  try{ await _pushQueue; }catch(e){}
  const ids = Object.keys(_pushPending);
  for(const id of ids){
    const payload = _pushPending[id];
    delete _pushPending[id];
    try{ await api('/api/businesses/'+id, {method:'PUT', body:payload}); }catch(e){ console.warn(e); }
  }
}
window.addEventListener('beforeunload', function(){
  if(!SERVER_MODE || !API_TOKEN) return;
  // fetch+keepalive can carry the auth header (sendBeacon cannot). Anything that doesn't fit is
  // still in localStorage and is pushed on next start by syncPull (local newer wins).
  Object.keys(_pushPending).forEach(function(id){
    try{
      const body = JSON.stringify(_pushPending[id]);
      if(body.length < 60000) fetch('/api/businesses/'+id,{method:'PUT',keepalive:true,headers:{'Content-Type':'application/json',Authorization:'Bearer '+API_TOKEN},body:body}).catch(function(){});
    }catch(e){}
  });
});
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState==='hidden') flushPushes();
});

/** How many base measure units in 1 product unit (e.g. 1 pc = 100 m). */
function productPackQty(p){
  const n=Number(p&&p.packQty);
  return n>0?n:1;
}
function productPackUnit(p){
  if(p&&p.packUnit)return unitMeta(p.packUnit).id;
  return unitMeta(p&&p.unit||'pc').id;
}
function productPriceUnit(p){
  return unitMeta(p&&p.unit||'pc').id;
}
/** Fixed conversion factors between compatible units (to grams/metres/ml). */
const UNIT_TO_BASE={
  m:1, cm:0.01, sqm:1,
  g:1, kg:1000,
  ml:1, l:1000,
  pc:1, pack:1, set:1, dozen:12, unit:1, job:1, hr:1, day:1, roll:1, bottle:1, tin:1, bag:1, pair:1, carton:1, bundle:1
};
function unitToBase(u){
  const id=unitMeta(u).id;
  return UNIT_TO_BASE[id]!=null?UNIT_TO_BASE[id]:1;
}
function unitsCompatible(a,b){
  const A=unitMeta(a).id,B=unitMeta(b).id;
  if(A===B)return true;
  const groups=[['m','cm'],['g','kg'],['ml','l'],['pc','dozen','unit']];
  return groups.some(g=>g.includes(A)&&g.includes(B));
}
/**
 * Product lists price P for ONE `unit` (the whole item, e.g. 1 pc / 1 roll).
 * packQty + packUnit say what one whole item contains (e.g. 100 m).
 * Example: price 2800, unit pc, packQty 100, packUnit m  =>  1 m = KES 28.
 * Stock is kept in the whole `unit`; selling 1 m uses factor = 1/100 of a pc.
 * factor = how many `unit`s are used by 1 sellUnit.
 */
function sellFactor(p, sellUnit){
  p=p||{};
  const priceUnit=productPriceUnit(p);
  const packQ=productPackQty(p);
  const packU=productPackUnit(p);
  const sellU=unitMeta(sellUnit||priceUnit).id;
  if(sellU===priceUnit)return {factor:1,ok:true};
  if(packQ>0&&packQ!==1||packU!==priceUnit){
    if(unitsCompatible(sellU,packU)&&!unitsCompatible(packU,priceUnit)){
      return {factor:unitToBase(sellU)/(packQ*unitToBase(packU)),ok:true};
    }
  }
  if(unitsCompatible(sellU,priceUnit))return {factor:unitToBase(sellU)/unitToBase(priceUnit),ok:true};
  return {factor:1,ok:false};
}
function calcCartPricing(p, sellUnit, qty){
  p=p||{};
  const listPrice=Number(p.price)||0;
  const priceUnit=productPriceUnit(p);
  const packQ=productPackQty(p);
  const packU=productPackUnit(p);
  const sellU=unitMeta(sellUnit||priceUnit).id;
  qty=normalizeQty(sellU,qty);
  const sf=sellFactor(p,sellU);
  const unitPrice=money(listPrice*sf.factor);
  const lineTotal=money(unitPrice*qty);
  return {unitPrice,lineTotal,qty,sellUnit:sellU,listPrice,priceUnit,packQ,packU,ok:sf.ok,factor:sf.factor};
}
/** Stock (in the product's own unit) used by selling qty of sellUnit */
function stockNeeded(p, sellUnit, qty){
  const sf=sellFactor(p,sellUnit||productPriceUnit(p));
  return Math.round((Number(qty)||0)*sf.factor*10000)/10000;
}
/** Units the cashier may sell this product in: its own unit + the pack-content unit family */
function sellUnitOptions(p){
  const base=productPriceUnit(p);
  const ids=new Set([base]);
  const packQ=productPackQty(p),packU=productPackUnit(p);
  if(packQ!==1||packU!==base)ids.add(packU);
  const out=UNIT_OPTIONS.filter(u=>[...ids].some(i=>unitsCompatible(u.id,i)));
  return out.length?out:UNIT_OPTIONS.filter(u=>u.id===base);
}
function fmtStock(n){return String(Math.round((Number(n)||0)*100)/100)}
function cartLineFromProduct(p, sellUnit, qty){
  const sell=sellUnit||productPriceUnit(p);
  const pr=calcCartPricing(p,sell,qty!=null?qty:unitStep(sell));
  return {
    id:p.id,
    name:p.name,
    unit:pr.sellUnit,
    qty:pr.qty,
    price:pr.unitPrice, // price per selected unit (auto)
    listPrice:pr.listPrice,
    priceUnit:pr.priceUnit,
    packQty:pr.packQ,
    packUnit:pr.packU,
    lineTotal:pr.lineTotal
  };
}
function refreshCartLinePrice(row,p){
  if(!row)return;
  p=p||{};
  const pr=calcCartPricing(p,row.unit||p.unit||'pc',row.qty);
  row.price=pr.unitPrice;
  row.listPrice=pr.listPrice;
  row.priceUnit=pr.priceUnit;
  row.packQty=pr.packQ;
  row.packUnit=pr.packU;
  row.lineTotal=pr.lineTotal;
  row.qty=pr.qty;
}

const UNIT_ALIASES={metre:'m',meter:'m',metres:'m',meters:'m',mtr:'m',mtrs:'m',gram:'g',grams:'g',kilo:'kg',kilos:'kg',kilogram:'kg',kilograms:'kg',
  litre:'l',liter:'l',litres:'l',liters:'l',millilitre:'ml',milliliter:'ml',piece:'pc',pieces:'pc',pcs:'pc',each:'pc',box:'pack',packet:'pack',packs:'pack',
  bottles:'bottle',bags:'bag',rolls:'roll',tins:'tin',pairs:'pair',cartons:'carton',bundles:'bundle',hour:'hr',hours:'hr','sq m':'sqm','sq.m':'sqm',service:'job',sets:'set',dozens:'dozen'};
function unitMeta(u){
  const s=String(u==null||u===''?'pc':u).toLowerCase().trim().replace(/^per\s+/,'');
  let m=UNIT_OPTIONS.find(x=>x.id===s||x.suffix.toLowerCase()===s);
  if(m)return m;
  if(UNIT_ALIASES[s])return UNIT_OPTIONS.find(x=>x.id===UNIT_ALIASES[s]);
  if(/sq\.?\s*m|m²|square/.test(s))m=UNIT_OPTIONS.find(x=>x.id==='sqm');
  else if(/kg|kilo/.test(s))m=UNIT_OPTIONS.find(x=>x.id==='kg');
  else if(/millilit|\bml\b/.test(s))m=UNIT_OPTIONS.find(x=>x.id==='ml');
  else if(/litre|liter|\bl\b/.test(s))m=UNIT_OPTIONS.find(x=>x.id==='l');
  else if(/gram|\bg\b/.test(s))m=UNIT_OPTIONS.find(x=>x.id==='g');
  else if(/metre|meter|\bm\b/.test(s))m=UNIT_OPTIONS.find(x=>x.id==='m');
  else if(/\bcm\b|centi/.test(s))m=UNIT_OPTIONS.find(x=>x.id==='cm');
  else if(/hour|\bhr\b/.test(s))m=UNIT_OPTIONS.find(x=>x.id==='hr');
  else if(/pack|box/.test(s))m=UNIT_OPTIONS.find(x=>x.id==='pack');
  else if(/job|service/.test(s))m=UNIT_OPTIONS.find(x=>x.id==='job');
  else if(/day/.test(s))m=UNIT_OPTIONS.find(x=>x.id==='day');
  else if(/dozen/.test(s))m=UNIT_OPTIONS.find(x=>x.id==='dozen');
  else if(/\bset\b/.test(s))m=UNIT_OPTIONS.find(x=>x.id==='set');
  return m||UNIT_OPTIONS[0];
}
function unitLabel(u){return unitMeta(u).label}
function unitSuffix(u){return unitMeta(u).suffix}
function unitStep(u){return unitMeta(u).step}
function isWholeUnit(u){return !!unitMeta(u).whole}
function normalizeQty(u,qty){
  const m=unitMeta(u);
  let q=Number(qty)||0;

/** Relative size to a dimension base for automatic unit conversion */
const UNIT_FACTOR={
  mm:{d:'len',f:0.001},cm:{d:'len',f:0.01},m:{d:'len',f:1},
  g:{d:'mass',f:1},kg:{d:'mass',f:1000},
  ml:{d:'vol',f:1},l:{d:'vol',f:1000},

  roll:{d:'roll',f:1},bottle:{d:'bottle',f:1},tin:{d:'tin',f:1},bag:{d:'bag',f:1},pair:{d:'pair',f:1},carton:{d:'carton',f:1},bundle:{d:'bundle',f:1}

async function hashOfflineCred(email,password){
  const s=String(email||'').toLowerCase().trim()+'|'+String(password||'');
  if(window.crypto&&crypto.subtle){
    try{
      const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }catch(e){}
  }
  // fallback non-crypto hash
  let h=2166136261;
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}
  return 'f'+((h>>>0).toString(16));
}
function rememberOfflineLogin(email,password){
  const em=String(email||'').toLowerCase().trim();
  if(!em||!password)return;
  hashOfflineCred(em,password).then(hash=>{
    const store=offlineAuthStore();
    store[em]={hash:hash,at:new Date().toISOString()};
    setOfflineAuthStore(store);
  }).catch(()=>{});
}
async function verifyOfflineLogin(email,password){
  const em=String(email||'').toLowerCase().trim();
  const store=offlineAuthStore();
  const row=store[em];
  if(!row||!row.hash)return false;
  const hash=await hashOfflineCred(em,password);
  return hash===row.hash;
}

function tryOfflineOwnerLogin(email,password,netErr){
  const showErr=function(msg){
    const el=document.getElementById('loginErr');
    if(el){el.textContent=msg;el.classList.remove('hidden')}
  };
  const d=db();
  const em=String(email||'').toLowerCase().trim();
  // 1) Local plaintext password (registered offline on this device)
  let u=(d.users||[]).find(x=>String(x.email||'').toLowerCase()===em&&x.password&&x.password===password);
  if(u&&u.role!=='admin'&&u.email!==(d.adminEmail||'admin@businesshub.ke')){
    rememberOfflineLogin(em,password);
    completeLocalOwnerLogin(u);
    toast('Logged in offline');
    return;
  }
  // 2) Offline hash from a previous online login on this device
  verifyOfflineLogin(em,password).then(ok=>{
    if(!ok){
      showErr((netErr&&netErr.message&&!/fetch|network|failed to/i.test(netErr.message))?netErr.message:'Could not log in offline. Check the email and password. Offline login only works for accounts you have already logged in to (with internet) on this device — connect once and log in, then it works offline.');
      return;
    }
    u=findLocalUserByEmail(em);
    if(!u){
      // create minimal local user shell so session works (businesses already on device from sync)
      u={id:'local-'+em.replace(/[^a-z0-9]/g,''),email:em,password:'',name:em.split('@')[0],role:'owner'};
      d.users.push(u);save(d);
    }
    // Attach owner to local businesses by email if ownerId mismatch
    (d.businesses||[]).forEach(b=>{
      if(!b.ownerId&&b.ownerEmail&&String(b.ownerEmail).toLowerCase()===em)b.ownerId=u.id;
      if(b.ownerEmail&&String(b.ownerEmail).toLowerCase()===em)b.ownerId=u.id;
    });
    // Prefer businesses already on device
    let mine=(d.businesses||[]).filter(b=>b.ownerId===u.id);
    if(!mine.length)mine=(d.businesses||[]).filter(b=>String(b.ownerEmail||'').toLowerCase()===em);
    if(mine.length){mine.forEach(b=>{b.ownerId=u.id});}
    save(d);
    completeLocalOwnerLogin(u);
    toast('Logged in offline (this device)');
  }).catch(function(){
    showErr('Offline login failed');
  });
}

/* local calendar date (toISOString is UTC and shifts days/months for UTC+ zones such as Kenya) */
function localYMD(dt){return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')}
function periodKeys(mode){
  const now=new Date();const keys=[];
  if(mode==='daily'){for(let i=13;i>=0;i--){const dt=new Date(now);dt.setDate(dt.getDate()-i);keys.push(localYMD(dt))}}
  else if(mode==='weekly'){for(let i=11;i>=0;i--){const dt=new Date(now);dt.setDate(dt.getDate()-i*7);const onejan=new Date(dt.getFullYear(),0,1);const week=Math.ceil((((dt-onejan)/86400000)+onejan.getDay()+1)/7);keys.push(dt.getFullYear()+'-W'+String(week).padStart(2,'0'))}}
  else if(mode==='monthly'){for(let i=11;i>=0;i--){const dt=new Date(now.getFullYear(),now.getMonth()-i,1);keys.push(localYMD(dt).slice(0,7))}}
  else{for(let i=4;i>=0;i--)keys.push(String(now.getFullYear()-i))}
  return keys;
}
function keyForDate(day,mode){
  if(!day)return '';
  if(mode==='daily')return day;if(mode==='monthly')return day.slice(0,7);if(mode==='yearly')return day.slice(0,4);
  const dt=new Date(day+'T12:00:00');const onejan=new Date(dt.getFullYear(),0,1);
  const week=Math.ceil((((dt-onejan)/86400000)+onejan.getDay()+1)/7);
  return dt.getFullYear()+'-W'+String(week).padStart(2,'0');
}
function bucketPnL(b,mode){
  const labels=periodKeys(mode);const incMap={},expMap={};
  labels.forEach(k=>{incMap[k]=0;expMap[k]=0});
  paidOrders(b).forEach(o=>{const k=keyForDate(parseDay(o.date),mode);if(k in incMap)incMap[k]+=o.total});
  (b.expenses||[]).forEach(e=>{const k=keyForDate(parseDay(e.date),mode);if(!(k in incMap))return;if(e.type==='EXPENSE')expMap[k]+=e.amount;else if(e.type==='INCOME')incMap[k]+=e.amount});
  return {labels,income:labels.map(k=>money(incMap[k])),expenses:labels.map(k=>money(expMap[k])),profit:labels.map(k=>money(incMap[k]-expMap[k]))};
}

      <input id="newPin2" type="password" inputmode="numeric" maxlength="6" class="w-full border rounded-xl px-3 py-2.5 mb-3 text-center text-lg tracking-widest" placeholder="Confirm"/>
      <p id="pinErr" class="hidden text-sm text-red-600 mb-2"></p>
      <button type="button" id="pinSave" class="w-full py-3 rounded-xl text-white font-semibold" style="background:${S.accent()}">Save PIN</button>
      <button type="button" id="pinCancel" class="w-full py-2 text-sm text-slate-500 mt-2">Cancel</button>`);
    document.getElementById('pinCancel').onclick=closeModal;
    document.getElementById('pinSave').onclick=()=>{
      const a=document.getElementById('newPin1').value.trim(),c=document.getElementById('newPin2').value.trim(),err=document.getElementById('pinErr');
      if(!/^\d{4,6}$/.test(a)){err.textContent='PIN must be 4–6 digits';err.classList.remove('hidden');return}
      if(a!==c){err.textContent='PINs do not match';err.classList.remove('hidden');return}
      setSalesPin(a);const bb=biz();if(bb){bb.pinFails=0;bb.pinLocked=false;saveBiz(bb)}
      closeModal();toast('Sales PIN saved');onOk();
    };
    return;
  }
  const fails=Number(b.pinFails||0);
  openModal(`<h3 class="text-lg font-bold mb-2">Enter sales PIN</h3>
    <p class="text-xs text-slate-500 mb-2">${fails?('Attempts used: '+fails+'/2'):'2 attempts allowed'}</p>
    <input id="checkPin" type="password" inputmode="numeric" maxlength="6" class="w-full border rounded-xl px-3 py-2.5 mb-3 text-center text-lg tracking-widest" autofocus/>
    <p id="pinErr" class="hidden text-sm text-red-600 mb-2"></p>
    <button type="button" id="pinOk" class="w-full py-3 rounded-xl text-white font-semibold" style="background:${S.accent()}">Confirm sale</button>
    <button type="button" id="pinCancel" class="w-full py-2 text-sm text-slate-500 mt-2">Cancel</button>`);
  const input=document.getElementById('checkPin');
  const go=()=>{
    const bb=biz();if(!bb)return;
    if(input.value.trim()===getSalesPin()){
      bb.pinFails=0;bb.pinLocked=false;saveBiz(bb);closeModal();onOk();return;
    }
    bb.pinFails=Number(bb.pinFails||0)+1;
    if(bb.pinFails>=2){
      bb.pinLocked=true;bb.pinLockedAt=new Date().toISOString();saveBiz(bb);
      if(typeof SERVER_MODE!=='undefined'&&SERVER_MODE){
        api('/api/admin/pin-lock',{method:'POST',body:{businessId:bb.id,fails:bb.pinFails}}).catch(function(){});
      }
      closeModal();
      openModal(`<h3 class="text-lg font-bold text-red-700 mb-2">PIN locked</h3>
        <p class="text-sm text-slate-600 mb-3">2 incorrect attempts. Admin has been notified to unlock your sales PIN.</p>
        <button type="button" id="pinCancel" class="w-full py-2.5 rounded-xl border">OK</button>`);
      document.getElementById('pinCancel').onclick=closeModal;
      return;
    }
    saveBiz(bb);
    document.getElementById('pinErr').textContent='Incorrect PIN ('+bb.pinFails+'/2). One more wrong try will lock the PIN.';
    document.getElementById('pinErr').classList.remove('hidden');
    input.value='';input.focus();
  };
  document.getElementById('pinCancel').onclick=closeModal;
  document.getElementById('pinOk').onclick=go;
  input.onkeydown=e=>{if(e.key==='Enter')go()};
  setTimeout(()=>input.focus(),80);
}

function normalizeMsisdn(phone){
  let p=String(phone||'').replace(/\s+/g,'').replace(/-/g,'');
  if(p.startsWith('+'))p=p.slice(1);
  if(p.startsWith('0'))p='254'+p.slice(1);
  if(p.startsWith('7')&&p.length===9)p='254'+p;
  if(p.startsWith('1')&&p.length===9)p='254'+p;
  return p;
}
function darajaTimestamp(){
  const d=new Date();
  const pad=n=>String(n).padStart(2,'0');
  return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds());
}
async function darajaGetToken(consumerKey, consumerSecret, sandbox){
  const base=sandbox?'https://sandbox.safaricom.co.ke':'https://api.safaricom.co.ke';
  const auth=btoa(consumerKey+':'+consumerSecret);
  const res=await fetch(base+'/oauth/v1/generate?grant_type=client_credentials',{headers:{Authorization:'Basic '+auth}});
  if(!res.ok)throw new Error('Daraja token failed ('+res.status+'). Use a proxy URL if CORS blocks the browser.');
  const data=await res.json();
  return data.access_token;
}
async function darajaStkPush(opts){
  const p=opts.payments||{};
  const sandbox=p.sandbox!==false;
  const shortcode=p.shortcode||p.till||'';
  const passkey=p.passkey||'';
  const consumerKey=p.consumerKey||'';
  const consumerSecret=p.consumerSecret||'';
  const proxy=(p.proxyUrl||'').replace(/\/$/,'');
  const msisdn=normalizeMsisdn(opts.phone);
  const amt=Math.max(1,Math.round(Number(opts.amount)||1));
  if(proxy){
    const res=await fetch(proxy+'/stkpush',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:msisdn,amount:amt,accountRef:opts.accountRef||'MyBusinessHub',description:opts.description||'Payment',sandbox})});
    const data=await res.json().catch(function(){return {}});
    if(!res.ok)throw new Error(data.error||data.errorMessage||'Proxy STK failed');
    return {ok:true,via:'proxy',data:data};
  }
  if(!consumerKey||!consumerSecret||!shortcode||!passkey){
    return {ok:true,via:'demo',data:{CheckoutRequestID:'ws_CO_DEMO_'+Date.now(),CustomerMessage:'Demo STK accepted'}};
  }
  try{
    const token=await darajaGetToken(consumerKey,consumerSecret,sandbox);
    const ts=darajaTimestamp();
    const password=btoa(shortcode+passkey+ts);
    const base=sandbox?'https://sandbox.safaricom.co.ke':'https://api.safaricom.co.ke';
    const body={
      BusinessShortCode:shortcode,Password:password,Timestamp:ts,
      TransactionType:p.transactionType||'CustomerPayBillOnline',
      Amount:amt,PartyA:msisdn,PartyB:shortcode,PhoneNumber:msisdn,
      CallBackURL:p.callbackUrl||'https://mydomain.com/api/mpesa/callback',
      AccountReference:String(opts.accountRef||'MyBusinessHub').slice(0,12),
      TransactionDesc:String(opts.description||'Payment').slice(0,13)
    };
    const res=await fetch(base+'/mpesa/stkpush/v1/processrequest',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(body)});
    const data=await res.json().catch(function(){return {}});
    if(!res.ok||(data.ResponseCode&&data.ResponseCode!=='0'&&data.ResponseCode!==0)){
      throw new Error(data.errorMessage||data.ResponseDescription||'STK push failed');
    }
    return {ok:true,via:'daraja',data:data};
  }catch(err){
    return {ok:true,via:'demo',warning:String(err.message||err),data:{CheckoutRequestID:'ws_CO_DEMO_'+Date.now()}};
  }
}

function parseDay(s){
  if(!s)return null;
  const p=String(s).slice(0,10).split('-');
  if(p.length<3)return null;
  return new Date(Number(p[0]),Number(p[1])-1,Number(p[2]));
}
function toDate(val){
  if(!val)return null;
  if(val instanceof Date)return isNaN(val.getTime())?null:val;
  const s=String(val).slice(0,10);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return null;
  const d=new Date(s+'T12:00:00');
  return isNaN(d.getTime())?null:d;
}
function addDays(dayStr, n){
  const d=toDate(dayStr)||new Date();
  d.setDate(d.getDate()+Number(n||0));
  const pad=x=>String(x).padStart(2,'0');
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function trialEndsOn(b){
  if(!b)return today();
  if(b.trialEndsAt)return String(b.trialEndsAt).slice(0,10);
  return addDays(b.createdAt||today(), 3);
}
function daysLeftInTrial(b){
  try{
    const end=toDate(trialEndsOn(b));
    const now=toDate(today())||new Date();
    if(!end)return 0;
    const ms=end.getTime()-now.getTime();
    return Math.ceil(ms/86400000);
  }catch(e){return 0}
}
function planIsPaid(b){
  const p=String((b&&b.plan)||'FREE').toUpperCase();
  return p==='STARTER'||p==='PRO'||p==='BUSINESS'||p==='ENTERPRISE'||p==='PAID';
}
function trialExpired(b){
  if(planIsPaid(b))return false;
  return daysLeftInTrial(b)<0;
}
/** Max workers allowed by the business's plan (Infinity when the plan sets no number) */
function workerLimit(b){
  const plans=db().plans||DEFAULT_PLANS;
  const key=String((b&&b.plan)||'FREE').toUpperCase();
  const pl=plans[key]||plans.FREE||DEFAULT_PLANS.FREE||{};
  return (typeof pl.workers==='number'&&pl.workers>=0)?pl.workers:Infinity;
}
function workerPlanName(b){

function canAddWorker(b){

function maybeClientAutoBackup(){
  try{
    const b=biz();if(!b||b.autoBackup===false)return;
    const last=b.lastAutoBackupAt?Date.parse(b.lastAutoBackupAt):0;
    const twoDays=2*24*60*60*1000;
    if(last&&(Date.now()-last)<twoDays)return;
    const u=currentUser();if(!u||!u.email)return;
    // fire and forget server backup
    api('/api/businesses/'+b.id+'/backup',{method:'POST',body:{email:u.email,sendEmail:false,auto:true}}).then(()=>{
      b.lastAutoBackupAt=new Date().toISOString();
      saveBiz(b);
    }).catch(()=>{});
  }catch(e){}
}

function downloadJSON(filename, obj){
  const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url)},1500);
}

  const d=db();
  return {type:'businesshub_admin_backup',version:1,exportedAt:new Date().toISOString(),data:{users:d.users,businesses:d.businesses,plans:d.plans,platform:d.platform,notices:d.notices,adminEmail:d.adminEmail}};

function restoreBusinessBackup(payload, mode){
  if(!payload||payload.type!=='businesshub_business_backup'||!payload.business)throw new Error('Invalid business backup file');
  const d=db();
  const u=currentUser();
  if(!u)throw new Error('Not logged in');
  const src=payload.business;
  if(mode==='new'){
    const b=emptyBiz(u.id);
    Object.assign(b,src,{id:uid(),ownerId:u.id,name:(src.name||'Restored')+' (restored)',cart:[]});
    d.businesses.push(b);d.currentBizId=b.id;save(d);
    return b;
  }
  const b=biz();
  if(!b)throw new Error('No active business');
  const keepId=b.id, keepOwner=b.ownerId;
  Object.assign(b,src,{id:keepId,ownerId:keepOwner,cart:src.cart||[]});
  saveBiz(b);
  return b;
}
function restoreAdminBackup(payload){
  if(!payload||payload.type!=='businesshub_admin_backup'||!payload.data)throw new Error('Invalid admin backup file');
  const d=db();
  const data=payload.data;
  if(data.users)d.users=data.users;
  if(data.businesses)d.businesses=data.businesses;
  if(data.plans)d.plans=data.plans;
  if(data.platform)d.platform=data.platform;
  if(data.notices)d.notices=data.notices;
  if(data.adminEmail)d.adminEmail=data.adminEmail;
  const admin=d.users.find(u=>u.role==='admin'||u.email===d.adminEmail);
  if(admin)d.session=admin.id;
  save(d);
  return d;
}

function normalizeProductUnits(b){
  if(!b||!b.products)return;
  b.products.forEach(p=>{
    if(p.packQty==null&&Number(p.packSize)>0){p.packQty=Number(p.packSize);p.packUnit=p.packSizeUnit||p.unit||'pc'}
    if(!p.unit)p.unit='pc';
    else{
      const m=unitMeta(p.unit);
      // store canonical id for consistency
      if(m&&!UNIT_OPTIONS.find(x=>x.id===p.unit))p.unit=m.id;
    }
  });
}

function safeRender(){

      const t=document.activeElement.tagName;
      if(t==='INPUT'||t==='SELECT'||t==='TEXTAREA')document.activeElement.blur();

  try{applyTheme(S.theme||localStorage.getItem('bh_theme')||'light')}catch(e){try{document.documentElement.setAttribute('data-theme','light')}catch(e2){}}
  const d=db();
  // Worker session (no owner session) → restricted worker UI only
  if(!d.session && currentWorker()){
    if(S.view!=='workerLogin')S.view='worker';

    if(S.view!=='admin'&&S.view!=='forgot'&&S.view!=='adminLogin'&&S.view!=='adminRegister')S.view='admin';
  }else if(d.session&&!isAdmin()){
    // Owner session — never stay on worker views
    if(S.view==='worker'||S.view==='workerLogin')S.view='app';
    const mine=myBusinesses();
    if(!mine.length){
      if(S.view!=='onboard'&&S.view!=='register'&&S.view!=='login')S.view='onboard';
    }else{
      if(!d.currentBizId||!mine.find(b=>b.id===d.currentBizId)){d.currentBizId=mine[0].id;save(d)}
      const b=biz();
      if(b&&!b.shopMode&&S.view!=='onboard'&&S.view!=='shopMode')S.view='shopMode';
      else if(b&&b.shopMode&&S.view!=='onboard'&&S.view!=='online'&&S.view!=='forgot'&&S.view!=='shopMode'){
        if(S.view!=='app')S.view='app';
      }
    }
  }
  setAccent();
  if(chartInst){try{chartInst.destroy()}catch(e){}chartInst=null}
  (window.__adCharts||[]).forEach(c=>{try{c.destroy()}catch(e){}});window.__adCharts=[];
  const root=document.getElementById('root');
  const setRoot=(html)=>{
    if(!root)return;
    try{
      root.style.cssText='width:100%;max-width:100vw;margin:0;padding:0;left:0;position:relative;transform:none;overflow-x:hidden';
      while(root.firstChild)root.removeChild(root.firstChild);

      try{root.innerHTML=html}catch(e2){
        try{root.textContent='Something went wrong. Tap Reload.';console.error(e2)}catch(e3){}

    }
  };
  try{
    if(S.view==='landing')setRoot(viewLanding());

    else if(S.view==='adminRegister')setRoot(viewAdminRegister());
    else if(S.view==='onboard')setRoot(viewOnboard());

  if(badge){badge.textContent=SERVER_MODE?'Server DB':'Local only';badge.className='text-xs px-2 py-1 rounded-full '+(SERVER_MODE?'bg-emerald-100 text-emerald-800':'bg-slate-100 text-slate-500')}

      const prevN=JSON.stringify((db().notices||[]).map(n=>n.id));

        const nextN=JSON.stringify((db().notices||[]).map(n=>n.id));

/* Owner side: bring in online orders customers placed on their own devices (server holds them).
   Merges missing orders into the local copy and deducts their stock, exactly like the server does, so nothing local is overwritten. */
let _ooBusy=false;
async function pullOnlineOrders(){
  if(_ooBusy||!SERVER_MODE||!API_TOKEN||isAdmin()||S.view!=='app')return;
  _ooBusy=true;
  try{
    const full=await api('/api/businesses');const d=db();let added=0;
    (full.businesses||[]).forEach(function(rb){
      const lb=d.businesses.find(x=>x.id===rb.id);if(!lb)return;
      const known=new Set((lb.orders||[]).map(o=>o&&o.id));
      const missing=(rb.orders||[]).filter(o=>o&&!known.has(o.id));
      if(!missing.length)return;
      lb.orders=(lb.orders||[]).concat(missing);
      missing.forEach(function(o){
        if(o.status==='CANCELLED')return;
        (o.items||[]).forEach(function(it){
          const p=(lb.products||[]).find(x=>x.id===it.product_id);if(!p)return;
          p.stock=Math.max(0,Math.round(((Number(p.stock)||0)-stockNeeded(p,it.unit||productPriceUnit(p),Number(it.qty)||0))*10000)/10000);
        });
      });
      ['orderN','onlineN'].forEach(k=>{lb[k]=Math.max(Number(lb[k])||0,Number(rb[k])||0)});
      added+=missing.length;
    });
    if(added){
      save(d);
      toast(added+' new online order'+(added>1?'s':''));
      const ae=document.activeElement;const typing=ae&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName);
      const modalOpen=!document.getElementById('modal').classList.contains('hidden');
      if(!typing&&!modalOpen)safeRender();
    }
  }catch(e){/* offline or signed out: try again next tick */}
  finally{_ooBusy=false}
}

function viewWorkerApp(){
  const cw=currentWorker();
  if(!cw){S.view='workerLogin';return viewWorkerLogin()}
  const d=db();
  if(d.session){clearWorkerSession();S.view='app';return viewApp()}
  const b=cw.business;const w=cw.worker;const a=b.color||'#0f172a';
  d.currentBizId=b.id;save(d);
  const perms=Object.assign({dashboard:true,shop:true,invoices:true},w.permissions||{});
  const allowed=typeof workerAllowedViews==='function'?workerAllowedViews(w):['dashboard','shop','invoices'];
  const menuAll=[
    ['dashboard','Mini dashboard'],
    ['shop','Shop / POS'],
    ['invoices','Invoices & receipts'],
    ['onlineorders','Online orders'],
    ['delivery','Delivery'],
    ['stock','Stock'],
    ['products','Products'],
    ['customers','Customers'],
    ['purchases','Purchases'],
    ['expenses','Expenses'],
    ['shifts','Shifts'],
    ['reports','Reports']
  ].filter(x=>allowed.includes(x[0]));
  if(!allowed.includes(S.appView))S.appView=allowed[0]||'dashboard';
  const myOrders=paidOrders(b).filter(o=>o.servedBy&&(o.servedBy.id===w.id||o.servedBy.name===(w.firstName||w.name)));
  const sum=arr=>arr.reduce((s,o)=>s+Number(o.total||0),0);
  const qtySold=arr=>{let q=0;arr.forEach(o=>(o.items||[]).forEach(it=>q+=Number(it.qty||0)));return q};
  const itemsCount=arr=>{const set=new Set();arr.forEach(o=>(o.items||[]).forEach(it=>set.add(it.name||it.product_id)));return set.size};
  const todaySales=myOrders.filter(o=>o.date===today());
  const weekStart=(()=>{const t=new Date();t.setDate(t.getDate()-6);return localYMD(t)})();
  const weekSales=myOrders.filter(o=>o.date>=weekStart);
  const monthPrefix=today().slice(0,7);

        <div class="rounded-2xl border p-4 bg-white"><p class="text-xs text-slate-500">Commission</p><p class="text-lg font-bold">${commissionPct?kes(commissionEarned):'—'}</p></div>

      <div class="flex flex-wrap gap-2">

        <p style="font-weight:700;font-size:14px;margin:0">Worker menu</p>

      <button type="button" id="workerSignOut" style="margin:12px;padding:10px;border:0;border-radius:8px;background:rgba(255,255,255,.1);color:#fff;cursor:pointer;font-size:13px">Log out</button>
    </aside>
    <div id="workerMain">
      <header>
        <div style="display:flex;align-items:center;gap:8px;min-width:0">
          <button type="button" id="workerMenuToggle" style="padding:6px 10px;border:1px solid #e2e8f0;border-radius:8px;background:#fff;cursor:pointer">☰</button>
          <button type="button" id="workerBackBtn" style="padding:6px 12px;border:1px solid #e2e8f0;border-radius:8px;background:#fff;cursor:pointer;font-size:13px">← Back</button>

}

function secDash(b,a){
  ensureBranches(b);
  const day=today();
  const notices=(db().notices||[]).slice(-5).reverse();
  const trialLeft=daysLeftInTrial(b);
  const from=S.dashFrom||'';
  const to=S.dashTo||'';
  const branch=S.dashBranch||'all';
  const worker=S.dashWorker||'all';
  const cat=S.dashCat||'all';
  const pay=S.dashPay||'all';
  let orders=paidOrders(b);
  if(from)orders=orders.filter(o=>o.date>=from);
  if(to)orders=orders.filter(o=>o.date<=to);
  if(branch!=='all')orders=orders.filter(o=>(o.branchId||'main')===branch);
  if(worker!=='all')orders=orders.filter(o=>o.servedBy&&(o.servedBy.id===worker||o.servedBy.name===worker));
  if(pay!=='all')orders=orders.filter(o=>String(o.payMethod||o.method||'').toLowerCase().includes(String(pay).toLowerCase()));
  if(cat!=='all')orders=orders.filter(o=>(o.items||[]).some(it=>{
    const p=(b.products||[]).find(x=>x.id===it.product_id||x.name===it.name);
    return p&&(p.category===cat||(p.categories||[]).includes(cat));
  }));
  const sales=money(orders.reduce((s,o)=>s+Number(o.total||0),0));
  let expensesList=(b.expenses||[]).filter(e=>e.type==='EXPENSE'||!e.type);
  if(from)expensesList=expensesList.filter(e=>String(e.date||'')>=from);
  if(to)expensesList=expensesList.filter(e=>String(e.date||'')<=to);
  const expenses=money(expensesList.reduce((s,e)=>s+Number(e.amount||0),0));
  let incomeExtra=(b.expenses||[]).filter(e=>e.type==='INCOME');
  if(from)incomeExtra=incomeExtra.filter(e=>String(e.date||'')>=from);
  if(to)incomeExtra=incomeExtra.filter(e=>String(e.date||'')<=to);
  const extraInc=money(incomeExtra.reduce((s,e)=>s+Number(e.amount||0),0));
  const totalIncome=money(sales+extraInc);
  const grossProfit=money(sales-expenses);
  const netProfit=money(totalIncome-expenses);
  const stockValue=money((b.products||[]).reduce((s,p)=>s+(Number(p.stock)||0)*(Number(p.cost)||Number(p.price)||0)*0.7,0));
  const purchases=money((b.expenses||[]).filter(e=>e.category==='purchase'||e.type==='PURCHASE'||/purchase/i.test(e.note||e.category||'')).reduce((s,e)=>s+Number(e.amount||0),0));
  const creditOrders=(b.orders||[]).filter(o=>o.status==='CREDIT'||o.payMethod==='Credit');
  const debts=money(creditOrders.reduce((s,o)=>s+Number(o.total||0),0));
  const suppliers=(b.suppliers||[]);
  const supplierBal=money(suppliers.reduce((s,x)=>s+Number(x.balance||0),0));
  const lowStock=(b.products||[]).filter(p=>p.active!==false&&(p.stock||0)>0&&(p.stock||0)<=(p.reorder||5)).slice(0,8);
  const expiryAlerts=(b.products||[]).filter(p=>p.expiry&&String(p.expiry)<=addDays(today(),30)).slice(0,8);
  const workers=b.workers||[];
  const workerPerf=workers.map(w=>{
    const wo=orders.filter(o=>o.servedBy&&(o.servedBy.id===w.id||o.servedBy.name===(w.firstName||w.name)));
    return {name:(w.firstName||w.name||'')+' '+(w.lastName||''),n:wo.length,total:money(wo.reduce((s,o)=>s+Number(o.total||0),0))};
  }).sort((a,b)=>b.total-a.total);
  const branches=b.branches||[{id:'main',name:'Main'}];
  const branchPerf=branches.map(br=>{
    const bo=orders.filter(o=>(o.branchId||'main')===br.id);
    return {name:br.name,n:bo.length,total:money(bo.reduce((s,o)=>s+Number(o.total||0),0))};
  });
  const recentInv=(b.orders||[]).slice().reverse().slice(0,6);
  const tips=typeof aiInsights==='function'?aiInsights(b).slice(0,3):[];
  const trialBanner=!planIsPaid(b)?`<div class="rounded-xl p-3 mb-4 text-sm ${trialLeft<0?'bg-red-50 border border-red-100 text-red-900':trialLeft<=1?'bg-amber-50 border border-amber-100 text-amber-950':'bg-emerald-50 border border-emerald-100 text-emerald-900'}">
    ${trialLeft<0?`<b>Trial ended.</b> Choose a paid plan.`:`<b>Free trial:</b> ${trialLeft} day(s) left · ends ${esc(trialEndsOn(b))} · <button type="button" data-nav="settings" class="underline font-semibold">Plans</button>`}
  </div>`:'';
  const teamBanner=(b.shopMode==='team')?`<div class="bg-slate-900 text-white rounded-2xl p-4 mb-4 flex flex-wrap items-center justify-between gap-3">
      <div><p class="font-semibold">Team mode</p><p class="text-xs text-slate-300">Workers use separate login. They cannot open your owner dashboard.</p></div>
      <div class="flex gap-2">
        <button type="button" data-nav="team" class="text-xs px-3 py-2 rounded-lg bg-white text-slate-900 font-medium">Manage workers</button>
        <button type="button" id="openWorkerLoginBtn" class="text-xs px-3 py-2 rounded-lg border border-white/40">Open worker login</button>
      </div>
    </div>`:'';
  const workerOpts=workers.map(w=>`<option value="${w.id}" ${worker===w.id?'selected':''}>${esc(w.firstName||w.name||'')}</option>`).join('');
  const branchOpts=branches.map(br=>`<option value="${br.id}" ${branch===br.id?'selected':''}>${esc(br.name)}</option>`).join('');
  const cats=[...new Set((b.categories||[]).concat((b.products||[]).map(p=>p.category).filter(Boolean)))];
  return `<div class="space-y-4">
    ${teamBanner}${trialBanner}
    <div class="rounded-2xl border p-3 bg-white/90 flex flex-wrap gap-2 items-end text-sm">
      <div><label class="text-xs text-slate-500">From</label><input type="date" id="dashFrom" value="${esc(from)}" class="border rounded-lg px-2 py-1.5 block"/></div>
      <div><label class="text-xs text-slate-500">To</label><input type="date" id="dashTo" value="${esc(to)}" class="border rounded-lg px-2 py-1.5 block"/></div>
      <div><label class="text-xs text-slate-500">Branch</label><select id="dashBranch" class="border rounded-lg px-2 py-1.5 block"><option value="all">All</option>${branchOpts}</select></div>
      <div><label class="text-xs text-slate-500">Worker</label><select id="dashWorker" class="border rounded-lg px-2 py-1.5 block"><option value="all">All</option>${workerOpts}</select></div>
      <div><label class="text-xs text-slate-500">Category</label><select id="dashCat" class="border rounded-lg px-2 py-1.5 block"><option value="all">All</option>${cats.map(c=>`<option value="${esc(c)}" ${cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
      <div><label class="text-xs text-slate-500">Payment</label><select id="dashPay" class="border rounded-lg px-2 py-1.5 block"><option value="all">All</option>${PAY_METHODS.map(m=>`<option value="${m}" ${pay===m?'selected':''}>${m}</option>`).join('')}</select></div>
      <button type="button" id="dashApply" class="px-3 py-1.5 rounded-lg text-white text-sm font-medium" style="background:${a}">Apply</button>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
      <div class="rounded-2xl p-4 border bg-gradient-to-br from-emerald-50 to-white border-emerald-100"><p class="text-xs text-emerald-800">Total sales</p><p class="text-xl font-bold text-emerald-900">${kes(sales)}</p></div>
      <div class="rounded-2xl p-4 border bg-gradient-to-br from-sky-50 to-white border-sky-100"><p class="text-xs text-sky-800">Total income</p><p class="text-xl font-bold text-sky-900">${kes(totalIncome)}</p></div>
      <div class="rounded-2xl p-4 border bg-gradient-to-br from-rose-50 to-white border-rose-100"><p class="text-xs text-rose-800">Total expenses</p><p class="text-xl font-bold text-rose-900">${kes(expenses)}</p></div>
      <div class="rounded-2xl p-4 border bg-gradient-to-br from-violet-50 to-white border-violet-100"><p class="text-xs text-violet-800">Net profit</p><p class="text-xl font-bold text-violet-900">${kes(netProfit)}</p></div>
      <div class="rounded-2xl p-4 border bg-white"><p class="text-xs text-slate-500">Gross profit</p><p class="text-lg font-bold">${kes(grossProfit)}</p></div>
      <div class="rounded-2xl p-4 border bg-white"><p class="text-xs text-slate-500">Stock value (est.)</p><p class="text-lg font-bold">${kes(stockValue)}</p></div>
      <div class="rounded-2xl p-4 border bg-white"><p class="text-xs text-slate-500">Purchases</p><p class="text-lg font-bold">${kes(purchases)}</p></div>
      <div class="rounded-2xl p-4 border bg-white"><p class="text-xs text-slate-500">Outstanding debts</p><p class="text-lg font-bold">${kes(debts)}</p></div>
      <div class="rounded-2xl p-4 border bg-white"><p class="text-xs text-slate-500">Supplier balances</p><p class="text-lg font-bold">${kes(supplierBal)}</p></div>
    </div>
    <div class="grid md:grid-cols-2 gap-3">
      <div class="rounded-2xl border p-4 bg-white">
        <h3 class="font-semibold mb-2">Worker performance</h3>
        ${workerPerf.length?workerPerf.slice(0,8).map(w=>`<div class="flex justify-between text-sm border-b py-1.5"><span>${esc(w.name)}</span><span>${w.n} · ${kes(w.total)}</span></div>`).join(''):'<p class="text-sm text-slate-400">No worker sales in filter</p>'}
      </div>
      <div class="rounded-2xl border p-4 bg-white">
        <h3 class="font-semibold mb-2">Branch performance</h3>
        ${branchPerf.map(br=>`<div class="flex justify-between text-sm border-b py-1.5"><span>${esc(br.name)}</span><span>${br.n} · ${kes(br.total)}</span></div>`).join('')}
      </div>
    </div>
    <div class="grid md:grid-cols-2 gap-3">
      <div class="rounded-2xl border p-4 bg-white">
        <div class="flex justify-between items-center mb-2"><h3 class="font-semibold">Recent invoices</h3><button type="button" data-nav="invoices" class="text-xs underline">All</button></div>
        ${recentInv.map(o=>`<button type="button" data-open-inv="${o.id}" class="w-full text-left text-sm border-b py-2 flex justify-between hover:bg-slate-50"><span>${esc(o.number)} · ${esc(o.payMethod||'')}</span><span>${kes(o.total)}</span></button>`).join('')||'<p class="text-slate-400 text-sm">No invoices</p>'}
      </div>
      <div class="rounded-2xl border p-4 bg-white">
        <h3 class="font-semibold mb-2">Low stock & expiry</h3>
        ${lowStock.length?lowStock.map(p=>`<p class="text-sm text-amber-800">⚠ ${esc(p.name)} · ${p.stock} left</p>`).join(''):'<p class="text-sm text-slate-400">No low stock</p>'}
        ${expiryAlerts.length?'<hr class="my-2"/>'+expiryAlerts.map(p=>`<p class="text-sm text-red-700">📅 ${esc(p.name)} · exp ${esc(p.expiry)}</p>`).join(''):''}

async function loadHtml5Qrcode(){
  if(window.Html5Qrcode)return window.Html5Qrcode;
  return new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
    s.onload=()=>resolve(window.Html5Qrcode);
    s.onerror=()=>reject(new Error('Could not load camera scanner library'));
    document.head.appendChild(s);
  });
}
async function startCameraBarcodeScan(onCode){
  const finish=()=>{try{if(window.__bhScanner){window.__bhScanner.stop().catch(()=>{});window.__bhScanner=null}}catch(e){}
    try{if(window.__bhScanStream){window.__bhScanStream.getTracks().forEach(t=>t.stop());window.__bhScanStream=null}}catch(e){}
    closeModal();
  };
  openModal(`<h3 class="text-lg font-bold mb-2">Camera barcode scan</h3>
    <div id="qr-reader" class="rounded-xl overflow-hidden bg-black min-h-[240px] mb-2"></div>
    <p id="scanStatus" class="text-xs text-slate-500 mb-2">Starting camera… Allow camera permission if asked.</p>
    <button type="button" id="stopScanBtn" class="w-full py-2.5 rounded-xl border font-medium">Stop camera</button>
    <p class="text-[11px] text-slate-400 mt-2">Works best in Chrome / Edge on phone. Hold steady over the barcode.</p>`);
  document.getElementById('stopScanBtn').onclick=finish;

  // Prefer html5-qrcode (wider support)
  try{
    const Html5Qrcode=await loadHtml5Qrcode();
    const scanner=new Html5Qrcode('qr-reader');
    window.__bhScanner=scanner;
    const status=document.getElementById('scanStatus');
    if(status)status.textContent='Camera on — point at barcode or QR';
    await scanner.start(
      {facingMode:'environment'},
      {fps:10,qrbox:{width:250,height:150},aspectRatio:1.5},
      (decoded)=>{
        if(!decoded)return;
        finish();
        onCode(String(decoded).trim());
      },
      ()=>{}
    );
    return finish;
  }catch(e1){
    console.warn('html5-qrcode failed',e1);
  }

  // Fallback: BarcodeDetector API
  if(window.BarcodeDetector&&navigator.mediaDevices){
    try{
      const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
      window.__bhScanStream=stream;
      const wrap=document.getElementById('qr-reader');
      const video=document.createElement('video');
      video.srcObject=stream;video.setAttribute('playsinline','true');video.muted=true;video.style.width='100%';
      wrap.innerHTML='';wrap.appendChild(video);await video.play();
      const detector=new BarcodeDetector({formats:['ean_13','ean_8','code_128','code_39','qr_code','upc_a','upc_e','codabar','itf']});
      let stopped=false;
      document.getElementById('stopScanBtn').onclick=()=>{stopped=true;finish()};
      const status=document.getElementById('scanStatus');
      if(status)status.textContent='Camera on (BarcodeDetector) — point at barcode';
      const loop=async()=>{
        if(stopped)return;
        try{
          const codes=await detector.detect(video);
          if(codes&&codes[0]&&codes[0].rawValue){
            stopped=true;finish();onCode(String(codes[0].rawValue).trim());return;
          }
        }catch(e){}
        requestAnimationFrame(loop);
      };
      loop();
      return finish;
    }catch(e2){
      console.warn(e2);
    }
  }

  const status=document.getElementById('scanStatus');
  if(status)status.innerHTML='<span class="text-red-600">Camera unavailable.</span> Use HTTPS, allow camera permission, or type/USB-scan the barcode.';
  return finish;
}


function genBarcode(){
  // Generate 12 digits + EAN-13 check digit (local barcodes, not GS1-registered)
  let s='200'+String(Date.now()).slice(-9);
  s=s.slice(0,12);
  let sum=0;
  for(let i=0;i<12;i++)sum+=parseInt(s[i],10)*(i%2===0?1:3);
  const check=(10-(sum%10))%10;
  return s+String(check);
}
function barcodeSvg(code, opts){
  code=String(code||'').replace(/\D/g,'');
  if(!code)return '';
  const h=opts&&opts.height||48;
  // Simple pattern: map each digit to bar widths (visual barcode, scannable by many phone apps when printed clear)
  const patterns=['00110','10001','01001','11000','00101','10100','01100','00011','10010','01010'];
  let bars='101'; // start
  for(let i=0;i<code.length;i++){
    const d=parseInt(code[i],10);
    const p=patterns[isNaN(d)?0:d];
    bars+=p+(i%2===0?'0':'1');
  }
  bars+='101';
  const unit=2;
  let x=0;let rects='';
  for(let i=0;i<bars.length;i++){
    if(bars[i]==='1')rects+=`<rect x="${x}" y="0" width="${unit}" height="${h}" fill="#000"/>`;
    x+=unit;
  }
  const w=x;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h+16}" viewBox="0 0 ${w} ${h+16}" role="img" aria-label="${esc(code)}">${rects}<text x="${w/2}" y="${h+12}" text-anchor="middle" font-size="11" font-family="monospace">${esc(code)}</text></svg>`;
}

  const expiring=products.filter(p=>p.expiry&&String(p.expiry)<=addDays(today(),30));
  const prodOpts=products.map(p=>`<option value="${p.id}">${esc(p.name)} (stock ${p.stock||0})</option>`).join('');
  const branchOpts=(b.branches||[]).map(br=>`<option value="${br.id}">${esc(br.name)}</option>`).join('');
  let body='';
  if(tab==='overview'){
    const q=(S.stockSearch||'').toLowerCase();
    let list=products.slice().sort((x,y)=>(x.stock||0)-(y.stock||0));
    if(q)list=list.filter(p=>((p.name||'')+(p.sku||'')+(p.barcode||'')+(p.sub||'')).toLowerCase().includes(q));
    body=`<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
      <div class="rounded-xl border p-3 bg-white"><p class="text-xs text-slate-500">Products</p><p class="text-xl font-bold">${products.length}</p></div>
      <div class="rounded-xl border p-3 bg-amber-50"><p class="text-xs">Low stock</p><p class="text-xl font-bold text-amber-900">${low.length}</p></div>
      <div class="rounded-xl border p-3 bg-red-50"><p class="text-xs">Near expiry</p><p class="text-xl font-bold text-red-800">${expiring.length}</p></div>
      <div class="rounded-xl border p-3 bg-emerald-50"><p class="text-xs">Stock value</p><p class="text-xl font-bold text-emerald-900">${kes(stockValueOf(b))}</p></div>
    </div>
    <div class="flex flex-col sm:flex-row gap-2 mb-3">
      <input id="stockSearch" value="${esc(S.stockSearch||'')}" placeholder="Search name, SKU, barcode…" class="flex-1 border rounded-xl px-3 py-2 text-sm"/>
      <div class="flex gap-2">
        <input id="stockBarcodeScan" class="border rounded-xl px-3 py-2 text-sm w-40" placeholder="Scan barcode"/>
        <button type="button" id="stockCameraScan" class="px-3 py-2 rounded-xl border-2 border-teal-600 bg-teal-50 text-sm font-semibold">📷 Scan</button>
      </div>
    </div>
    <div class="overflow-x-auto bg-white rounded-xl border">
      <table class="w-full text-sm min-w-[720px]"><thead class="text-left text-slate-500 text-xs bg-slate-50"><tr>
        <th class="px-3 py-2">Product</th><th class="px-3 py-2">SKU</th><th class="px-3 py-2">Barcode</th><th class="px-3 py-2">Unit</th><th class="px-3 py-2">Stock</th><th class="px-3 py-2">Batch</th><th class="px-3 py-2">Expiry</th><th class="px-3 py-2">Reorder</th>
      </tr></thead><tbody>
      ${list.map(p=>`<tr class="border-t ${(p.stock||0)<=(p.reorder||5)?'bg-amber-50/50':''}">
        <td class="px-3 py-2 font-medium">${esc(p.name)}<p class="text-xs text-slate-400">${esc(p.sub||p.category||'')}</p></td>
        <td class="px-3 py-2 text-xs">${esc(p.sku||'—')}</td>
        <td class="px-3 py-2 text-xs">${esc(p.barcode||'—')}</td>
        <td class="px-3 py-2 text-xs"><select data-punit="${p.id}" class="border rounded px-1 py-0.5 text-xs max-w-[80px]">
          ${UNIT_OPTIONS.map(u=>`<option value="${u.id}" ${(p.unit||'pc')===u.id?'selected':''}>${esc(u.suffix)}</option>`).join('')}
        </select></td>
        <td class="px-3 py-2 font-semibold">${fmtStock(p.stock)}</td>
        <td class="px-3 py-2 text-xs">${esc(p.batch||'—')}</td>
        <td class="px-3 py-2 text-xs">${esc(p.expiry||'—')}</td>
        <td class="px-3 py-2 text-xs">${p.reorder||5}</td>
      </tr>`).join('')||'<tr><td colspan="7" class="px-3 py-8 text-center text-slate-400">No products</td></tr>'}
      </tbody></table>
    </div>`;
  } else if(tab==='receive'||tab==='issue'||tab==='adjust'){
    const title=tab==='receive'?'Stock receiving':tab==='issue'?'Stock issuing':'Stock adjustment';
    const hint=tab==='receive'?'Increase stock (purchases, returns in).':tab==='issue'?'Decrease stock (damage, internal use).':'Set absolute stock or +/- adjustment.';
    body=`<div class="bg-white rounded-xl border p-4 max-w-lg">
      <h4 class="font-semibold mb-1">${title}</h4>
      <p class="text-xs text-slate-500 mb-3">${hint}</p>
      <form id="stockMoveForm" data-move="${tab}" class="space-y-2 text-sm">
        <div><label class="text-xs text-slate-500">Product</label><select name="productId" required class="w-full border rounded-xl px-3 py-2">${prodOpts}</select></div>
        <div><label class="text-xs text-slate-500">Unit</label>${unitSelectHtml('unit','pc')}</div>
        <div><label class="text-xs text-slate-500">Quantity ${tab==='adjust'?'(use + or − e.g. 5 or -3, or set absolute below)':''}</label>
          <input name="qty" type="number" step="0.01" required class="w-full border rounded-xl px-3 py-2" placeholder="${tab==='adjust'?'e.g. 5 or -2':''}"/></div>
        ${tab==='adjust'?`<label class="flex items-center gap-2 text-xs"><input type="checkbox" name="absolute"/> Set absolute stock to this quantity</label>`:''}
        <div><label class="text-xs text-slate-500">Batch / lot</label><input name="batch" class="w-full border rounded-xl px-3 py-2"/></div>
        <div><label class="text-xs text-slate-500">Note</label><input name="note" class="w-full border rounded-xl px-3 py-2"/></div>
        <button class="w-full py-2.5 rounded-xl text-white font-semibold" style="background:${a}">Record ${tab}</button>
      </form>
    </div>`;
  } else if(tab==='transfer'){
    body=`<div class="bg-white rounded-xl border p-4 max-w-lg">
      <h4 class="font-semibold mb-1">Stock transfer</h4>
      <p class="text-xs text-slate-500 mb-3">Move quantity between branches (logged in history).</p>
      <form id="stockTransferForm" class="space-y-2 text-sm">
        <div><label class="text-xs text-slate-500">Product</label><select name="productId" required class="w-full border rounded-xl px-3 py-2">${prodOpts}</select></div>
        <div><label class="text-xs text-slate-500">Unit</label>${unitSelectHtml('unit','pc')}</div>
        <div><label class="text-xs text-slate-500">Qty</label><input name="qty" type="number" step="0.01" min="0" required class="w-full border rounded-xl px-3 py-2"/></div>
        <div><label class="text-xs text-slate-500">From branch</label><select name="fromBranch" class="w-full border rounded-xl px-3 py-2">${branchOpts}</select></div>
        <div><label class="text-xs text-slate-500">To branch</label><select name="toBranch" class="w-full border rounded-xl px-3 py-2">${branchOpts}</select></div>
        <div><label class="text-xs text-slate-500">Note</label><input name="note" class="w-full border rounded-xl px-3 py-2"/></div>
        <button class="w-full py-2.5 rounded-xl text-white font-semibold" style="background:${a}">Transfer</button>
      </form>
    </div>`;
  } else if(tab==='movements'){
    const moves=(b.stockMovements||[]).slice(0,100);
    body=`<div class="bg-white rounded-xl border overflow-x-auto">
      <table class="w-full text-sm min-w-[640px]"><thead class="text-left text-xs text-slate-500 bg-slate-50"><tr>
        <th class="px-3 py-2">When</th><th class="px-3 py-2">Type</th><th class="px-3 py-2">Product</th><th class="px-3 py-2">Qty</th><th class="px-3 py-2">Batch</th><th class="px-3 py-2">Note</th><th class="px-3 py-2">By</th>
      </tr></thead><tbody>
      ${moves.map(m=>`<tr class="border-t"><td class="px-3 py-2 text-xs">${esc((m.at||'').slice(0,16).replace('T',' '))}</td>
        <td class="px-3 py-2 text-xs font-medium">${esc(m.type)}</td><td class="px-3 py-2">${esc(m.productName)}</td>
        <td class="px-3 py-2">${m.qty}</td><td class="px-3 py-2 text-xs">${esc(m.batch||'—')}</td>
        <td class="px-3 py-2 text-xs">${esc(m.note||'')}${m.fromBranch?` · ${esc(m.fromBranch)}→${esc(m.toBranch||'')}`:''}</td>
        <td class="px-3 py-2 text-xs">${esc(m.by||'')}</td></tr>`).join('')||'<tr><td colspan="7" class="px-3 py-8 text-center text-slate-400">No movements yet</td></tr>'}
      </tbody></table>
    </div>`;
  } else if(tab==='valuation'){
    const rows=products.map(p=>{
      const cost=Number(p.cost)!=null&&p.cost!==''?Number(p.cost):(Number(p.price)||0)*0.7;
      const val=money((Number(p.stock)||0)*cost);
      return {name:p.name,sku:p.sku,stock:p.stock||0,cost,val};
    }).sort((a,b)=>b.val-a.val);
    body=`<div class="bg-white rounded-xl border p-4 mb-3"><p class="text-sm">Total stock value (cost-based): <b class="text-lg">${kes(stockValueOf(b))}</b></p>
      <p class="text-xs text-slate-500">Uses product cost if set; otherwise 70% of sell price.</p></div>
      <div class="overflow-x-auto bg-white rounded-xl border"><table class="w-full text-sm"><thead class="text-left text-xs text-slate-500 bg-slate-50"><tr>
        <th class="px-3 py-2">Product</th><th class="px-3 py-2">SKU</th><th class="px-3 py-2">Stock</th><th class="px-3 py-2">Unit cost</th><th class="px-3 py-2">Value</th>
      </tr></thead><tbody>
      ${rows.map(r=>`<tr class="border-t"><td class="px-3 py-2">${esc(r.name)}</td><td class="px-3 py-2 text-xs">${esc(r.sku||'—')}</td>
        <td class="px-3 py-2">${r.stock}</td><td class="px-3 py-2">${kes(r.cost)}</td><td class="px-3 py-2 font-medium">${kes(r.val)}</td></tr>`).join('')}
      </tbody></table></div>`;
  }
  return `<div class="space-y-4">
    <div class="flex flex-wrap gap-1">${tabNav}</div>
    ${body}
  </div>`;
}

/* ===== Reports: daily / weekly / monthly / yearly, printable ===== */
function rpParse(x){const p=String(x||'').slice(0,10).split('-');return new Date(+p[0],(+p[1]||1)-1,+p[2]||1)}
function rpFmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function rpRange(period,anchor){
  const d=rpParse(anchor);let st,en;
  if(period==='daily'){st=new Date(d);en=new Date(d)}
  else if(period==='weekly'){const dow=(d.getDay()+6)%7;st=new Date(d);st.setDate(d.getDate()-dow);en=new Date(st);en.setDate(st.getDate()+6)}
  else if(period==='monthly'){st=new Date(d.getFullYear(),d.getMonth(),1);en=new Date(d.getFullYear(),d.getMonth()+1,0)}
  else{st=new Date(d.getFullYear(),0,1);en=new Date(d.getFullYear(),11,31)}
  return {from:rpFmt(st),to:rpFmt(en),s:st,e:en}
}
function rpShift(period,anchor,dir){
  const d=rpParse(anchor);
  if(period==='daily')d.setDate(d.getDate()+dir);
  else if(period==='weekly')d.setDate(d.getDate()+7*dir);
  else if(period==='monthly'){d.setDate(1);d.setMonth(d.getMonth()+dir)}
  else{d.setDate(1);d.setFullYear(d.getFullYear()+dir)}
  return rpFmt(d)
}
function rpLabel(period,r){
  const o={day:'numeric',month:'short',year:'numeric'};
  if(period==='daily')return r.s.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  if(period==='weekly')return 'Week: '+r.s.toLocaleDateString('en-GB',o)+' – '+r.e.toLocaleDateString('en-GB',o);
  if(period==='monthly')return r.s.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  return 'Year '+r.s.getFullYear();
}
function secReports(b,a){
  const period=S.repPeriod||'daily';const anchor=S.repDate||today();
  const r=rpRange(period,anchor);
  const cur=b.currency||'KES';
  const M=n=>cur+' '+(Number(n)||0).toLocaleString('en-KE',{minimumFractionDigits:2,maximumFractionDigits:2});
  const inR=x=>{const d=String(x.date||'').slice(0,10);return d>=r.from&&d<=r.to};
  const orders=(b.orders||[]).filter(inR);
  const sales=orders.filter(o=>o.status==='PAID');
  const pending=orders.filter(o=>o.status==='PENDING');
  const exps=(b.expenses||[]).filter(e=>e.type==='EXPENSE'&&inR(e));
  const incs=(b.expenses||[]).filter(e=>e.type==='INCOME'&&inR(e));
  const sum=(arr,f)=>arr.reduce((t,x)=>t+(Number(f(x))||0),0);
  const tSales=sum(sales,o=>o.total),tInc=sum(incs,e=>e.amount),tExp=sum(exps,e=>e.amount),net=tSales+tInc-tExp;
  // breakdown buckets
  const keys=[];
  if(period==='yearly'){for(let m=1;m<=12;m++)keys.push(r.s.getFullYear()+'-'+String(m).padStart(2,'0'))}
  else if(period!=='daily'){const d=new Date(r.s);while(d<=r.e){keys.push(rpFmt(d));d.setDate(d.getDate()+1)}}
  const kOf=x=>{const d=String(x.date||'').slice(0,10);return period==='yearly'?d.slice(0,7):d};
  const bk={};keys.forEach(k=>bk[k]={n:0,sales:0,inc:0,exp:0});
  sales.forEach(o=>{const k=kOf(o);if(bk[k]){bk[k].n++;bk[k].sales+=Number(o.total)||0}});
  incs.forEach(e=>{const k=kOf(e);if(bk[k])bk[k].inc+=Number(e.amount)||0});

  // payment methods and products

    <div class="flex justify-between items-start gap-4 border-b pb-4">
      <div><h2 class="text-xl font-bold">${esc(b.name)}</h2>
        <p class="text-sm text-slate-500">${esc([b.address,b.phone].filter(Boolean).join(' · '))}</p></div>
      <div class="text-right"><p class="font-semibold">${({daily:'Daily',weekly:'Weekly',monthly:'Monthly',yearly:'Yearly'})[period]} sales report</p>
        <p class="text-sm text-slate-600">${esc(rpLabel(period,r))}</p></div>
    </div>
    <div class="rp-cards grid grid-cols-2 md:grid-cols-4 gap-3 mt-4">
      ${card('Sales ('+sales.length+')',tSales,'#047857')}${card('Other income',tInc,'#0369a1')}${card('Expenses',tExp,'#be123c')}${card('Net (sales + income − expenses)',net,net>=0?'#047857':'#be123c')}
    </div>
    ${pending.length?`<p class="mt-3 text-xs text-amber-700">Not counted above: ${pending.length} unpaid/pending order(s) worth ${M(sum(pending,o=>o.total))}.</p>`:''}
    ${period!=='daily'?`<h3 class="mt-6 mb-1 font-semibold">${period==='yearly'?'Month by month':'Day by day'}</h3>
    <div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr><th ${th}>${period==='yearly'?'Month':'Day'}</th><th ${thr}>Sales</th><th ${thr}>Amount</th><th ${thr}>Other income</th><th ${thr}>Expenses</th><th ${thr}>Net</th></tr></thead><tbody>
      ${keys.map(k=>{const x=bk[k];const nn=x.sales+x.inc-x.exp;return `<tr><td ${td}>${kLabel(k)}</td><td ${tdr}>${x.n}</td><td ${tdr}>${M(x.sales)}</td><td ${tdr}>${M(x.inc)}</td><td ${tdr}>${M(x.exp)}</td><td ${tdr}>${M(nn)}</td></tr>`}).join('')}
      <tr class="font-bold"><td ${td}>Total</td><td ${tdr}>${sales.length}</td><td ${tdr}>${M(tSales)}</td><td ${tdr}>${M(tInc)}</td><td ${tdr}>${M(tExp)}</td><td ${tdr}>${M(net)}</td></tr>

    <div class="grid md:grid-cols-2 gap-6 mt-6">

function totalSales(b){return money(paidOrders(b).reduce((s,o)=>s+Number(o.total||0),0))}
function totalExpenses(b){return money(((b&&b.expenses)||[]).filter(e=>e.type==='EXPENSE'||!e.type).reduce((s,e)=>s+Number(e.amount||0),0))}
function totalIncomeExtra(b){return money(((b&&b.expenses)||[]).filter(e=>e.type==='INCOME').reduce((s,e)=>s+Number(e.amount||0),0))}
function parseDay(d){try{return d?String(d).slice(0,10):null}catch(e){return null}}
function aiInsights(b){
  if(!b)return [];
  const tips=[];
  const orders=paidOrders(b);
  const products=b.products||[];
  const salesByProd={};
  orders.forEach(o=>(o.items||[]).forEach(it=>{
    const k=it.name||it.product_id||'?';
    salesByProd[k]=(salesByProd[k]||0)+(Number(it.qty)||0);
  }));
  const sorted=Object.keys(salesByProd).sort((a,c)=>salesByProd[c]-salesByProd[a]);
  if(sorted[0])tips.push({type:'sales',title:'Top seller',body:sorted[0]+' sold '+salesByProd[sorted[0]]+' units.'});
  const low=products.filter(p=>p.active!==false&&(p.stock||0)>0&&(p.stock||0)<=(p.reorder||5));
  if(low.length)tips.push({type:'stock',title:'Low stock',body:low.slice(0,5).map(p=>p.name+' ('+p.stock+')').join(', ')});
  const income=money(totalSales(b)+totalIncomeExtra(b));
  const expenses=totalExpenses(b);
  tips.push({type:'finance',title:'Profit snapshot',body:'Income '+kes(income)+' · Expenses '+kes(expenses)+' · Net '+kes(money(income-expenses))});
  if(!orders.length)tips.push({type:'sales',title:'No paid sales yet',body:'Record sales in Shop to unlock richer trends.'});
  return tips;
}
function stockForecast(b){
  const products=b.products||[];
  const orders=paidOrders(b);
  const days=30;
  const usage={};
  orders.forEach(o=>{(o.items||[]).forEach(it=>{
    const id=it.product_id||it.name;
    usage[id]=(usage[id]||0)+(Number(it.qty)||0);
  })});
  return products.filter(p=>p.active!==false).map(p=>{
    const sold=usage[p.id]||usage[p.name]||0;
    const daily=sold/days;
    const stock=Number(p.stock)||0;
    let daysLeft=daily>0?Math.floor(stock/daily):null;
    let reorder=daily>0?Math.ceil(daily*14):0;
    let confidence=sold>=10?'medium':(sold>0?'low':'insufficient data');
    return {id:p.id,name:p.name,stock,sold30:sold,daily:money(daily),daysLeft,reorderQty:reorder,confidence};
  }).sort((a,b)=>(a.daysLeft==null?999:a.daysLeft)-(b.daysLeft==null?999:b.daysLeft));
}
function answerBizQuestion(b,q){
  q=(q||'').toLowerCase();
  if(!b)return 'Select a business first.';
  if(/today/.test(q)&&/sell|sales/.test(q)){
    const t=paidOrders(b).filter(o=>o.date===today()).reduce((s,o)=>s+Number(o.total||0),0);
    return 'Paid sales today: '+kes(money(t))+'.';
  }
  if(/profit|earn/.test(q)){
    const income=money(totalSales(b)+totalIncomeExtra(b));
    return 'Net (income − expenses): '+kes(money(income-totalExpenses(b)))+'.';
  }
  if(/stock|restock/.test(q)){
    const f=stockForecast(b).filter(x=>x.daysLeft!=null&&x.daysLeft<14).slice(0,8);
    return f.length?('Restock: '+f.map(x=>x.name+' (~'+x.daysLeft+'d)').join('; ')):'No urgent restock signals.';
  }
  const tips=aiInsights(b);
  return tips[0]?tips[0].body:'Ask about sales, profit, or stock.';
}

function viewAdmin(){
  if(SERVER_MODE&&API_TOKEN&&!S._adminPullOnce){
    S._adminPullOnce=true;
    syncPull().then(function(){render()}).catch(function(){});
  }
  if(!isAdmin()){
    return `<div class="min-h-screen flex items-center justify-center p-6 bg-slate-100">
      <div class="bg-white rounded-2xl border p-8 max-w-md text-center">
        <h1 class="text-xl font-bold">Admin access only</h1>

        <button type="button" data-go="landing" class="mt-2 block w-full text-sm text-slate-500">Back to home</button>
      </div></div>`;
  }
  const d=db();
  if(!d.platform)d.platform={company:'MyBusinessHub',ownerName:'',phone:'',email:d.adminEmail||'admin@businesshub.ke',address:'',city:'Nairobi',country:'Kenya',mpesaTill:'',paybill:'',bankName:'',bankAccount:'',supportEmail:'',website:'',notes:''};
  const p=d.platform;
  const clients=d.users.filter(u=>u.role!=='admin'&&u.email!==(d.adminEmail||'admin@businesshub.ke'));

  const plans=mergePlans(d.plans||DEFAULT_PLANS);

  businesses.forEach(b=>{const k=b.plan||'FREE';planCounts[k]=(planCounts[k]||0)+1});

  const accentC=AD_THEMES[adTheme()];const dark=adDark();

  const tabs=[
    ['overview','Dashboard'],['clients','Users'],['businesses','Businesses'],['plans','Subscription plans'],['payments','Payments'],['tickets','Support'],['analytics','Analytics'],['profile','Platform settings'],['updates','Announcements'],['alerts','Alerts'],['audit','Audit log'],['backup','Backups']
  ];

  let body='';

    const soon=businesses.filter(b=>!planIsPaid(b)&&!b.suspended&&daysLeftInTrial(b)>=0&&daysLeftInTrial(b)<=1);

    const stat=(label,val,color,go,icon,prefix)=>`<button type="button" data-ad-goto="${go}" class="ad-stat text-left bg-white rounded-2xl border p-4" style="--c:${color}">
      <div class="flex items-center justify-between"><p class="text-xs text-slate-500">${label}</p><span class="ad-ico">${icon}</span></div>
      <p class="text-2xl font-bold mt-2" style="color:${color}" data-count="${val}" ${prefix?`data-prefix="${prefix}"`:''}>${prefix||''}${val}</p></button>`;
    const attn=expired.map(b=>({b,t:'Trial expired',c:'#dc2626'})).concat(soon.map(b=>({b,t:daysLeftInTrial(b)===0?'Ends today':'Ends tomorrow',c:'#d97706'})));
    body=`<div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-6">

    <div class="grid md:grid-cols-3 gap-3 mb-6">

        <p class="text-sm text-slate-500">${kes(plans[k].price)}/mo · up to ${plans[k].bizLimit} biz</p>

    </div>
    <div class="bg-white rounded-2xl border p-4 mb-6">
      <h3 class="font-semibold mb-2">Needs your attention ${attn.length?adPill(attn.length,'#dc2626'):''}</h3>

function showOrderPlaced(b,order,total,payMethod,fulfill,phone){
  const pay=b.payments||{};
  const till=pay.till||b.payinfo||'';
  let payHtml='';
  if(payMethod==='mpesa'){
    payHtml=`<div class="text-left bg-green-50 border border-green-100 rounded-xl p-3 mt-3 text-sm">
      <p class="font-semibold text-green-900">Pay with M-Pesa</p>
      ${till?`<p class="mt-1">Till / Paybill: <b>${esc(till)}</b></p>`:'<p class="mt-1">Shop will send M-Pesa details</p>'}
      ${pay.account?`<p>Account: <b>${esc(pay.account)}</b></p>`:''}
      <p class="text-xs text-green-800 mt-2">Amount: <b>${kes(total)}</b> · Use order ${esc(order.number)} as reference</p>
      <p class="text-xs text-slate-500 mt-2">Live STK Push needs Daraja API on a server. Keys saved in shop settings are ready for that integration.</p>
    </div>`;
  }else if(payMethod==='card'){
    payHtml=`<div class="text-left bg-blue-50 border border-blue-100 rounded-xl p-3 mt-3 text-sm">
      <p class="font-semibold text-blue-900">Card payment</p>
      <p class="mt-1 text-xs">Pesapal / Flutterwave checkout requires a live API host. This order is reserved; the shop will send a payment link or confirm when paid.</p>
      ${pay.publicKey?`<p class="text-xs mt-1 text-slate-500">Merchant key on file (not charged from this browser demo).</p>`:''}
    </div>`;
  }else{
    payHtml=`<div class="text-left bg-slate-50 rounded-xl p-3 mt-3 text-sm"><p>Pay on ${esc(fulfill)} — total <b>${kes(total)}</b></p></div>`;
  }
  openModal(`<div class="text-center py-2"><div class="text-4xl mb-2">✓</div><h3 class="text-xl font-bold">Order placed</h3>
    <p class="text-sm text-slate-500 mt-2">${esc(order.number)}</p><p class="font-semibold">${kes(total)}</p>
    ${payHtml}
    <p class="text-xs text-slate-500 mt-3">Shop: ${esc(b.name)} · ${esc(phone)}</p>
    <button type="button" id="olDone" class="mt-4 w-full py-2.5 rounded-xl text-white font-semibold" style="background:${b.color||'#0d9488'}">Done</button></div>`);
  document.getElementById('olDone').onclick=()=>{closeModal();render()};
  toast('Order sent to shop');
}

      <div class="grid sm:grid-cols-2 gap-3">${stores.map(b=>{
        const n=b.productCount!=null?b.productCount:(b.products||[]).filter(p=>p.active!==false&&(p.stock||0)>0).length;
        return `<button type="button" data-online-biz="${b.id}" class="bg-white border rounded-2xl p-4 text-left flex gap-3 hover:shadow-md transition">

            <p class="text-xs text-slate-500 truncate">${esc(b.categoryLabel||'Shop')}</p>

    </div></div>`;
  }

    loadPubShop(S.onlineBizId);
